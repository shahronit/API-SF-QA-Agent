        } catch (err) { out.innerHTML = String(errorBox(err)); }
      }));
      let importCol = null;
      on(view, 'change', '[name=pfile]', async (e) => { const f = e.target.files[0]; importCol = f ? await f.text() : null; });
      on(view, 'click', '[data-act=preview]', (e, el) => withBusy(el, async () => {
        const out = view.querySelector('[data-import]');
        if (!importCol) { toast('Choose a Postman collection file first.', 'warn'); return; }
        try {
          const r = await api.post(`/api/postman/import?projectId=${p.id}`, { collection: importCol, preview: true });
          out.innerHTML = String(h`<p class="small"><b>${r.count}</b> requests will become test cases (label ASSUMED, status assertions inferred from pm.test scripts).</p>
            <div class="table-wrap" style="max-height:240px;overflow:auto"><table class="t"><tbody>${r.drafts.slice(0, 50).map((d) => h`<tr><td>${QA.ui.method(d.method)}</td><td class="small">${d.title}<div class="cell-sub mono">${d.endpoint}</div></td><td class="small">${d.testType}</td></tr>`)}</tbody></table></div>
            <div class="row mt"><button class="btn primary" data-act="import">${ic('upload')} Import ${r.count} test cases</button></div>`);
        } catch (err) { out.innerHTML = String(errorBox(err)); }
      }));
      on(view, 'click', '[data-act=import]', (e, el) => withBusy(el, async () => {
        try { const r = await api.post(`/api/postman/import?projectId=${p.id}`, { collection: importCol, storyKey: view.querySelector('[name=pstory]').value.trim() || undefined }); toast(`${r.imported} test cases imported.`, 'ok', 'Import complete'); QA.router.go('/testcases?tag=imported'); } catch (err) { toastError(err, 'Import failed'); }
      }));
      return null;
    },
  };
})();
</script>
  <script>/* Insights: failing endpoints above a threshold, duplicate tests, coverage gaps. */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, prov, method, on, errorBox, loading, empty } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.insights = {
    async render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Insights' }]);
      let threshold = Number(ctx.query.failureRate || 10);
      view.innerHTML = String(h`${C.pageHead('Insights', 'Where quality risk concentrates: unstable endpoints, redundant tests and missing coverage. Items marked RECOMMENDED need a human decision.')}
        <div class="card" style="margin-bottom:16px"><div class="toolbar"><label class="small" for="thr">Show APIs with failure rate above</label><select class="select" id="thr" data-thr>${[0, 5, 10, 25, 50].map((t) => h`<option value="${t}" ${t === threshold ? 'selected' : ''}>${t}%</option>`)}</select></div></div><div data-body>${loading(8)}</div>`);
      const body = view.querySelector('[data-body]');
      async function load() {
        try {
          const d = await api.get(`/api/insights${api.qs({ projectId: p.id, failureRate: threshold })}`);
          const types = Object.entries(d.typeDistribution);
          body.innerHTML = String(h`<div class="grid g-21">
            <div class="card"><div class="card-head"><h2>APIs with failure rate above ${d.threshold}%</h2><span class="small muted">${d.failingEndpoints.length}</span></div>
              ${QA.ui.table({ rows: d.failingEndpoints, emptyState: empty({ icon: 'check', title: `No API fails more than ${d.threshold}% of the time`, text: 'Lower the threshold to see less frequent failures.' }), columns: [
                { key: 'endpoint', label: 'Endpoint', render: (x) => h`${method(x.method)} <code class="mono small">${fmt.shortPath(x.endpoint)}</code>` },
                { key: 'failureRate', label: 'Failure rate', render: (x) => h`<div class="row" style="gap:8px"><div class="progress" style="width:90px"><span style="width:${x.failureRate}%;background:var(--error)"></span></div><span class="num small">${x.failureRate}%</span></div>` },
                { key: 'runs', label: 'Executions', cls: 'num', render: (x) => h`${x.failed}/${x.runs}` }, { key: 'avgMs', label: 'Avg', cls: 'num', render: (x) => fmt.ms(x.avgMs) },
                { key: 'go', label: '', render: (x) => h`<a class="btn xs" href="/testcases?q=${encodeURIComponent(x.endpoint)}" data-link>Tests</a>` },
              ] })}</div>
            <div class="card"><div class="card-head"><h2>Test type mix</h2></div><div class="card-body">${types.length ? QA.charts.hbars({ items: types.map(([k, v]) => ({ label: k, value: v })) }) : h`<p class="small muted">No tests.</p>`}</div></div></div>
            <div class="grid g-2 mt">
              <div class="card"><div class="card-head"><h2>Coverage gaps</h2><span class="small muted">${d.gaps.length}</span></div><div class="card-body stack" style="gap:10px">${d.gaps.length ? d.gaps.map((g) => h`<div class="row" style="align-items:flex-start;gap:8px">${prov(g.label)}<span class="small" style="flex:1">${g.text}</span>${g.storyKey ? h`<a class="btn xs" href="/stories/${g.storyKey}" data-link>${ic('wand')} Generate</a>` : ''}</div>`) : h`<p class="small muted" style="margin:0">No gaps detected.</p>`}</div></div>
              <div class="card"><div class="card-head"><h2>Possible duplicate tests</h2><span class="small muted">${d.duplicates.length}</span></div>${QA.ui.table({ rows: d.duplicates, emptyState: empty({ icon: 'copy', title: 'No duplicates', text: 'No test cases share the same request and assertions.' }), columns: [
                { key: 'endpoint', label: 'Request', render: (x) => h`${method(x.method)} <code class="mono small">${fmt.shortPath(x.endpoint)}</code>` }, { key: 'count', label: 'Copies', cls: 'num' },
                { key: 'ids', label: 'Test cases', render: (x) => h`${x.ids.map((id) => h`<a href="/testcases?id=${id}" data-link class="mono small" style="margin-right:6px">${id}</a>`)}` },

  <script>/* Agent console: natural-language commands mapped to agent modes (Discover … Report). */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, on, errorBox, toastError, withBusy, esc } = QA.ui;
  const C = QA.components;
  const api = QA.api;
  const history = []; // kept for the session while navigating

  const EXAMPLES = [
    'Analyze Jira story DEMO-101 and generate Salesforce API test cases.',
    'Discover all APIs related to Contact.',
    'Generate negative tests for the Account API.',
    'Run only P0 and P1 tests.',
    'Validate the API response against Salesforce.',
    'Analyze failed tests from the latest execution.',
    'Create Jira defects for confirmed failures.',
    'Show me APIs with failure rate above 10%.',
    'Generate a Postman collection for this API.',
    'Generate the QA execution report.',
  ];

  QA.pages.agent = {
    render(view) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Agent console' }]);
      const modes = QA.state.meta.modes;
      view.innerHTML = String(h`${C.pageHead('Agent console', h`Type what you need in plain language. The agent picks a mode — ${modes.join(', ')} — and acts on ${p.name}. Jira defects and production writes always wait for your confirmation.`)}
        <div class="grid g-21"><div class="card" style="display:flex;flex-direction:column;min-height:560px">
          <div class="agent-log card-body" data-log style="flex:1;overflow-y:auto"></div>
          <form class="card-body row" data-form style="border-top:1px solid var(--border);gap:8px"><label class="sr-only" for="cmd">Command</label><input class="input" id="cmd" name="cmd" autocomplete="off" placeholder="e.g. Run the Account API regression suite in QA" style="flex:1"><button class="btn primary" type="submit">${ic('send')} Send</button></form>
        </div>
        <div class="stack"><div class="card"><div class="card-head"><h2>Try a command</h2></div><div class="card-body stack" style="gap:6px">${EXAMPLES.map((x) => h`<button class="btn sm ghost" style="justify-content:flex-start;white-space:normal;text-align:left;height:auto;padding:6px 8px" data-ex="${x}">${x}</button>`)}</div></div>
          <div class="card"><div class="card-head"><h2>Modes</h2></div><div class="card-body small">${modes.map((m) => h`<div style="margin-bottom:6px"><span class="mode-pill">${m}</span></div>`)}</div></div></div></div>`);
      const log = view.querySelector('[data-log]');
      const draw = () => {
        log.innerHTML = String(history.length ? h`${history.map((m) => (m.role === 'user' ? h`<div class="agent-msg user">${m.text}</div>` : renderReply(m)))}` : h`<div class="empty" style="padding:40px 16px">${ic('terminal')}<h3>Ask the agent</h3><p>Commands run against the current project and environment.</p></div>`);
        log.scrollTop = log.scrollHeight;
      };
      draw();
      const send = async (text, btn) => {
        if (!text.trim()) return;
        history.push({ role: 'user', text });
        draw();
        await withBusy(btn, async () => {
          try {
            const r = await api.post('/api/agent/command', { text, projectId: p.id });
            history.push({ role: 'agent', ...r });
          } catch (e) { history.push({ role: 'agent', mode: 'Error', message: e.message, error: e }); }
        });
        draw();
      };
      on(view, 'submit', '[data-form]', (e) => { e.preventDefault(); const i = view.querySelector('[name=cmd]'); const t = i.value; i.value = ''; send(t, e.target.querySelector('button')); });
      on(view, 'click', '[data-ex]', (e, el) => { view.querySelector('[name=cmd]').value = el.dataset.ex; view.querySelector('[name=cmd]').focus(); });
      on(log, 'click', '[data-dl]', async (e, el) => { try { await api.download(el.dataset.dl, el.dataset.name); } catch (err) { toastError(err); } });
      on(log, 'click', '[data-ex2]', (e, el) => { view.querySelector('[name=cmd]').value = el.dataset.ex2; });
      on(log, 'click', '[data-defect]', (e, el) => C.defectPreview(el.dataset.defect));
      setTimeout(() => view.querySelector('[name=cmd]').focus(), 30);
      return null;
    },
  };

  function renderReply(m) {
    const d = m.data || {};
    const list = (rows, cols) => h`<div class="table-wrap mt-s"><table class="t"><tbody>${rows.slice(0, 10).map((r) => h`<tr>${cols.map((c) => h`<td class="small">${c(r)}</td>`)}</tr>`)}</tbody></table></div>${rows.length > 10 ? h`<div class="small muted">…and ${rows.length - 10} more</div>` : ''}`;
    return h`<div class="agent-msg"><div class="row" style="gap:8px;margin-bottom:4px"><span class="mode-pill" style="${m.mode === 'Error' ? 'background:var(--error-soft);color:var(--error-text)' : ''}">${m.mode}</span>${m.modeDescription ? h`<span class="small muted">${m.modeDescription}</span>` : ''}</div>
      <div>${m.message}</div>
      ${m.error ? errorBox(m.error) : ''}${m.explanation ? errorBox({ message: m.explanation.title, info: m.explanation }) : ''}
      ${m.requiresConfirmation ? h`<div class="callout error mt-s">${ic('shield')}<div class="small">Production writes need explicit confirmation on the execution screen.</div></div>` : ''}
      ${d.objects ? list(d.objects, [(o) => h`<span class="mono">${o.name || o}</span>`, (o) => o.label || '']) : ''}
      ${d.apis ? list(d.apis, [(a) => QA.ui.method(a.method), (a) => h`<code class="mono">${fmt.shortPath(a.path)}</code>`, (a) => a.name || a.description || '']) : ''}
      ${d.candidates ? list(d.candidates, [(c) => c.title, (c) => h`<span class="muted">${c.rootCause || ''}</span>`, (c) => (c.defectKey ? c.defectKey : h`<button class="btn xs" data-defect="${c.resultId}">${ic('bug')} Preview defect</button>`)]) : ''}
      ${d.mismatches ? list(d.mismatches, [(c) => c.title, (c) => h`<span class="muted">${(c.diffs || c.fields || []).map ? (c.diffs || c.fields || []).map((x) => (typeof x === 'string' ? x : `${x.field}: ${x.expected} → ${x.actual}`)).join('; ') : ''}</span>`]) : ''}
      ${d.endpoints ? list(d.endpoints, [(x) => QA.ui.method(x.method), (x) => h`<code class="mono">${fmt.shortPath(x.endpoint)}</code>`, (x) => `${x.failureRate}%`]) : ''}
      ${d.categories ? list(d.categories, [(c) => c.category, (c) => `${c.count}`]) : ''}
      ${m.examples ? h`<div class="row wrap mt-s" style="gap:6px">${m.examples.map((x) => h`<button class="chip" data-ex2="${x}">${x}</button>`)}</div>` : ''}
      <div class="row wrap mt-s" style="gap:6px">${m.navigate ? h`<a class="btn sm" href="${m.navigate}" data-link>${ic('chevronRight')} Open</a>` : ''}${m.download ? h`<button class="btn sm" data-dl="${m.download}" data-name="collection.json">${ic('download')} Download</button>` : ''}${(m.downloads || []).map((x) => h`<button class="btn sm" data-dl="${x.url}" data-name="report.${x.format}">${ic('download')} ${x.format.toUpperCase()}</button>`)}</div></div>`;
  }
})();
</script>

  <script>/* Application shell: navigation, project/environment switchers, command palette,
   notifications, theme, environment band. Boots the router. */
(() => {
  const QA = window.QA;
  const { h, raw, ic, esc, fmt, on, debounce, toast } = QA.ui;
  const S = QA.state;
  const $ = (id) => document.getElementById(id);

  const NAV = [
    { label: 'Overview', items: [['/', 'Dashboard', 'dashboard'], ['/projects', 'Projects', 'folder']] },
    { label: 'Design', items: [['/stories', 'Jira stories', 'jira'], ['/scenarios', 'Test scenarios', 'layers'], ['/testcases', 'Test cases', 'list'], ['/explorer', 'API explorer', 'compass']] },
    { label: 'Execute', items: [['/execution', 'Test execution', 'play'], ['/defects', 'Defects', 'bug', 'defects'], ['/traceability', 'Traceability', 'tree']] },
    { label: 'Assets', items: [['/testdata', 'Test data', 'database'], ['/contracts', 'Contracts', 'file'], ['/automation', 'Automation', 'code']] },
    { label: 'Analyze', items: [['/reports', 'Reports', 'chart'], ['/insights', 'Insights', 'spark'], ['/agent', 'Agent console', 'terminal'], ['/logs', 'Audit log', 'log']] },
  ];
  const counts = { defects: 0 };

  function renderNav() {
    const path = QA.router.path;
    const active = (href) => (href === '/' ? path === '/' || path === '/dashboard' : path === href || path.startsWith(`${href}/`) || (href === '/stories' && path.startsWith('/generate')) || (href === '/traceability' && path === '/regression'));
    $('nav').innerHTML = String(h`${NAV.map((g) => h`<div class="nav-group"><div class="nav-label">${g.label}</div>${g.items.map(([href, label, icon, countKey]) => h`<a href="${href}" data-link class="${active(href) ? 'active' : ''}" ${active(href) ? raw('aria-current="page"') : ''}>${ic(icon)}<span>${label}</span>${countKey && counts[countKey] ? h`<span class="count" title="Open defects">${counts[countKey]}</span>` : ''}</a>`)}</div>`)}`);
  }

  function renderSidebarFoot() {
    const p = S.project;
    const m = S.meta || {};
    const sf = p && p.connection ? p.connection.salesforce : null;
    const jira = p && p.connection ? p.connection.jira : null;
    const dot = (s) => (s === 'connected' || s === 'configured' ? 'var(--success)' : s === 'demo' ? 'var(--warning)' : 'var(--error)');
    $('sidebar-foot').innerHTML = String(h`${p ? h`<div class="stack" style="gap:4px">
      <div class="row" style="gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:${dot(sf && sf.status)}"></span>Salesforce: ${sf ? sf.label : '–'}</div>
      <div class="row" style="gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:${dot(jira && jira.status)}"></span>Jira: ${jira ? jira.label : '–'}</div>
      <div class="faint" style="margin-top:4px">v${m.version || ''} · metadata ${p.connection ? p.connection.metadataLabel : ''}</div></div>` : ''}`);
  }

  function renderSwitchers() {
    const envs = [...new Set(S.projects.map((p) => p.environment))];
    const order = (S.meta && S.meta.environments) || envs;
    const envSel = $('env-switch');
    const cur = S.project;
    const envFilter = S.envFilter || '';
    envSel.innerHTML = String(h`<option value="">All environments</option>${order.filter((e) => envs.includes(e)).map((e) => h`<option value="${e}" ${e === envFilter ? 'selected' : ''}>${e}</option>`)}`);
    const list = S.projects.filter((p) => !envFilter || p.environment === envFilter);
    $('project-switch').innerHTML = String(list.length ? h`${list.map((p) => h`<option value="${p.id}" ${cur && p.id === cur.id ? 'selected' : ''}>${p.name} · ${p.environment}</option>`)}` : h`<option value="">No projects</option>`);
  }

  function renderEnvBand() {
    const p = S.project;
    const band = $('env-band');
    if (!p) { band.innerHTML = ''; return; }
    const sf = p.connection && p.connection.salesforce;
    if (p.environment === 'Production') {
      band.innerHTML = String(h`<div class="env-band" role="status">${ic('shield')}<span>Production · ${p.sfOrg || p.name} — read-only mode. Any data change requires explicit confirmation; DELETE requires a second confirmation.</span></div>`);
    } else if (sf && sf.status === 'unavailable') {
      band.innerHTML = String(h`<div class="env-band info" role="status">${ic('alert')}<span>Salesforce MCP is unavailable. API test design and automation generation are available, but live Salesforce validation is disabled.</span></div>`);
    } else band.innerHTML = '';
  }

  function renderChrome() {
    renderSwitchers();
    renderEnvBand();
    renderSidebarFoot();
    renderNav();
    const u = (S.meta && S.meta.user) || 'user';
    $('avatar').textContent = u.split(/[.\s_-]/).map((x) => x[0] || '').join('').slice(0, 2).toUpperCase();
    $('avatar').title = `Signed in as ${u}`;
    $('theme-btn').innerHTML = ic(S.theme === 'dark' ? 'sun' : 'moon');
    $('theme-btn').setAttribute('aria-label', S.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  async function refreshCounts() {
    const p = S.project;
    if (!p || QA.api.snapshot) return;
    try {
      const d = await QA.api.get(`/api/defects${QA.api.qs({ projectId: p.id, status: 'Open,In Progress,Reopened', pageSize: 1 })}`);
      counts.defects = d.total || 0;
      renderNav();
    } catch { /* non-critical */ }
  }

  // ── Notifications ──
  function renderNotifs() {
    const list = S.notifications;
    const unread = list.filter((n) => !n.read).length;
    $('notif-btn').innerHTML = ic('bell') + (unread ? '<span class="dot"></span>' : '');
    $('notif-btn').setAttribute('aria-label', unread ? `Notifications (${unread} unread)` : 'Notifications');
    $('notif-pop').innerHTML = String(h`<div class="popover-head"><span>Notifications</span>${list.length ? h`<button class="btn xs ghost" data-clear>Clear</button>` : ''}</div>
      <div style="max-height:380px;overflow-y:auto">${list.length ? list.map((n) => h`<div class="notif"><div class="row" style="gap:6px"><b>${n.title}</b><span class="spacer"></span><span class="when">${fmt.ago(n.at)}</span></div><div class="small muted">${raw(String(n.message instanceof QA.ui.Safe ? n.message : esc(n.message)))}</div></div>`) : h`<div class="empty" style="padding:28px 16px">${ic('bell')}<p>Run completions, defects and errors appear here.</p></div>`}</div>`);
  }

  // ── Command palette (⌘K) ──
  const TYPE_ICON = { story: 'jira', testcase: 'list', run: 'play', endpoint: 'code', defect: 'bug', request: 'send', sobject: 'database', page: 'chevronRight' };
  function openPalette() {
    if (document.querySelector('.palette')) return;
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.style.alignItems = 'flex-start';
    scrim.style.paddingTop = '12vh';
    scrim.innerHTML = String(h`<div class="palette" role="dialog" aria-modal="true" aria-label="Search"><input placeholder="Search stories, test cases, runs, endpoints, defects, objects…" aria-label="Search" autocomplete="off"><div class="palette-results" role="listbox"></div><div class="palette-hint"><span>↑↓ to move</span><span>↵ to open</span><span>esc to close</span><span class="spacer"></span><span>Type a command like “run P0 tests” in the agent console</span></div></div>`);
    $('overlay-root').appendChild(scrim);
    const input = scrim.querySelector('input');
    const results = scrim.querySelector('.palette-results');
    let items = [];
    let idx = 0;
    const close = () => scrim.remove();
    const pages = NAV.flatMap((g) => g.items.map(([href, label, icon]) => ({ type: 'page', title: label, href, icon })));
    const draw = (groups) => {
      items = groups.flatMap((g) => g.items);
      idx = Math.min(idx, Math.max(0, items.length - 1));
      let n = 0;
      results.innerHTML = String(items.length ? h`${groups.filter((g) => g.items.length).map((g) => h`<div class="palette-group">${g.label}</div>${g.items.map((it) => { const i = n++; return h`<div class="palette-item ${i === idx ? 'on' : ''}" role="option" aria-selected="${i === idx}" data-i="${i}">${ic(it.icon || TYPE_ICON[it.type] || 'chevronRight')}<span class="truncate">${it.id && it.type !== 'page' ? h`<b class="mono small">${it.id}</b> ` : ''}${it.title}</span><span class="meta">${it.meta || ''}</span></div>`; })}`)}` : h`<div class="empty" style="padding:28px">${ic('search')}<p>No matches. Search covers stories, tests, runs, endpoints, defects, saved requests and Salesforce objects in the current project.</p></div>`);
    };
    const hrefFor = (it) => {
      if (it.href) return it.href;
      switch (it.type) {
        case 'story': return `/stories/${it.id}`;
        case 'testcase': return `/testcases?id=${it.id}`;
        case 'run': return `/execution/${it.id}`;
        case 'defect': return `/defects?q=${encodeURIComponent(it.id)}`;
        case 'endpoint': return `/testcases?q=${encodeURIComponent(it.title)}`;
        case 'request': return `/explorer?request=${encodeURIComponent(it.id)}`;
        case 'sobject': return `/explorer?object=${encodeURIComponent(it.id)}`;
        default: return '/';
      }
    };
    const choose = (it) => { if (!it) return; close(); QA.router.go(hrefFor(it)); };
    const search = debounce(async () => {
      const q = input.value.trim();
      const pageMatches = pages.filter((p) => !q || p.title.toLowerCase().includes(q.toLowerCase()));
      if (q.length < 2) { draw([{ label: 'Go to', items: pageMatches }]); return; }
      try {
        const r = await QA.api.get(`/api/search${QA.api.qs({ q, projectId: S.projectId })}`);
        draw([...r.groups, { label: 'Go to', items: pageMatches }]);
      } catch (e) { results.innerHTML = String(QA.ui.errorBox(e, { compact: true })); }
    }, 180);
    input.addEventListener('input', () => { idx = 0; search(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { idx = Math.min(items.length - 1, idx + 1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); e.preventDefault(); }
      else if (e.key === 'Enter') { choose(items[idx]); return; }
      else if (e.key === 'Escape') { close(); return; }
      else return;
      results.querySelectorAll('.palette-item').forEach((el) => { const on2 = Number(el.dataset.i) === idx; el.classList.toggle('on', on2); el.setAttribute('aria-selected', on2); if (on2) el.scrollIntoView({ block: 'nearest' }); });
    });
    results.addEventListener('click', (e) => { const el = e.target.closest('[data-i]'); if (el) choose(items[Number(el.dataset.i)]); });
    scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) close(); });
    draw([{ label: 'Go to', items: pages }]);
    setTimeout(() => input.focus(), 10);
  }

  function bindChrome() {
    $('menu-btn').innerHTML = ic('menu');
    $('search-ico').innerHTML = ic('search');
    $('menu-btn').addEventListener('click', () => $('sidebar').classList.toggle('open'));
    $('nav').addEventListener('click', () => $('sidebar').classList.remove('open'));
    $('search-btn').addEventListener('click', openPalette);
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.querySelector('.scrim')) { e.preventDefault(); openPalette(); }
    });
    $('theme-btn').addEventListener('click', () => { S.setTheme(S.theme === 'dark' ? 'light' : 'dark'); renderChrome(); });
    $('notif-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const pop = $('notif-pop');
      pop.classList.toggle('hidden');
      if (!pop.classList.contains('hidden')) { S.notifications.forEach((n) => { n.read = true; }); renderNotifs(); }
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('#notif-pop') && !e.target.closest('#notif-btn')) $('notif-pop').classList.add('hidden'); });
    on($('notif-pop'), 'click', '[data-clear]', () => { S.notifications = []; renderNotifs(); });
    $('project-switch').addEventListener('change', (e) => { if (e.target.value) S.setProject(e.target.value); });
    $('env-switch').addEventListener('change', (e) => {
      S.envFilter = e.target.value;
      const first = S.projects.find((p) => !S.envFilter || p.environment === S.envFilter);
      renderSwitchers();
      if (first && (!S.project || (S.envFilter && S.project.environment !== S.envFilter))) S.setProject(first.id);
    });
    S.on('project', () => {
      renderChrome();
      refreshCounts();
      // Project-scoped pages re-render; detail routes return to their list.
      const cur = QA.router.current;
      if (!cur) return;
      const listPath = { '/stories/:key': '/stories', '/generate/:id': '/stories', '/execution/:runId': '/execution', '/testcases/:id': '/testcases', '/defects/:id': '/defects' }[cur.pattern];
      if (listPath) QA.router.go(listPath); else QA.router.render();
    });
    S.on('projects', renderChrome);
    S.on('notifications', renderNotifs);
    S.on('route', () => { renderNav(); $('sidebar').classList.remove('open'); });
    S.on('defects-changed', refreshCounts);
  }

  async function boot() {
    bindChrome();
    renderNotifs();
    $('view').innerHTML = String(QA.ui.loading(10));
    try {
      await S.load();
    } catch (e) {
      $('view').innerHTML = String(h`<div style="padding:24px">${QA.ui.errorBox(e)}</div>`);
      return;
    }
    renderChrome();
    refreshCounts();
    if (QA.api.snapshot) toast('This is a read-only snapshot. Run `npm start` for the live platform.', 'info', 'Snapshot');
    QA.router.render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
