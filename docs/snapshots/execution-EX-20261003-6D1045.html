  };

  const connDot = (s) => h`<span class="badge ${s.status === 'connected' || s.status === 'configured' ? 'ok' : s.status === 'demo' ? 'demo' : 'unavailable'}">${s.label}</span>`;

  function renderList(view) {
    QA.router.setCrumbs([{ label: 'Projects' }]);
    const S = QA.state;
    const rows = S.projects;
    view.innerHTML = String(h`${C.pageHead('Projects', 'Each project pairs a Salesforce org and environment with a Jira project. Credentials stay in environment variables or your secret manager — never in this UI.', h`<button class="btn primary" data-act="new">${ic('plus')} New project</button>`)}
      <div class="card">${QA.ui.table({ rows, rowAttrs: (r) => `data-href="/projects/${esc(r.id)}"`, emptyState: empty({ icon: 'folder', title: 'No projects yet', text: 'Create a project to connect a Salesforce org and Jira project.', action: h`<button class="btn primary" data-act="new">${ic('plus')} New project</button>` }), columns: [
        { key: 'name', label: 'Project', render: (r) => h`<div class="cell-title">${r.name}${r.id === S.projectId ? h` <span class="tag">current</span>` : ''}</div><div class="cell-sub">${r.description || ''}</div>` },
        { key: 'environment', label: 'Environment', render: (r) => (r.environment === 'Production' ? h`<span class="badge failed plain">${ic('shield')} Production</span>` : h`<span class="tag">${r.environment}</span>`) },
        { key: 'sfOrg', label: 'Salesforce org', render: (r) => h`<div class="mono small">${r.sfOrg || '–'}</div><div class="cell-sub">API v${r.apiVersion}</div>` },
        { key: 'conn', label: 'Salesforce', render: (r) => connDot(r.connection.salesforce) },
        { key: 'jira', label: 'Jira', render: (r) => h`${connDot(r.connection.jira)}<div class="cell-sub">${r.jiraProjectKey || ''}</div>` },
        { key: 'tests', label: 'Tests', cls: 'num', render: (r) => fmt.num(r.stats.tests) },
        { key: 'last', label: 'Last run', render: (r) => (r.stats.lastRun ? h`${badge(r.stats.lastRun.failed ? 'failed' : 'passed', `${r.stats.lastRun.passed}/${r.stats.lastRun.total}`)}<div class="cell-sub">${fmt.ago(r.stats.lastRun.startedAt)}</div>` : h`<span class="faint small">Never</span>`) },
        { key: 'mode', label: 'Mode', render: (r) => h`<span class="tag">${r.mode}</span>` },
      ] })}</div>`);
    on(view, 'click', '[data-act=new]', () => projectForm(null));
    return null;
  }

  function projectForm(p) {
    const envs = QA.state.meta.environments;
    modal({
      title: p ? `Edit ${p.name}` : 'New project', size: 'wide',
      subtitle: 'Reference credentials by prefix only. Secrets are read from environment variables on the server.',
      body: h`<div class="form-grid">
        <label class="field full"><span>Project name</span><input class="input" name="name" value="${p ? p.name : ''}" required></label>
        <label class="field"><span>Environment</span><select class="select" name="environment">${envs.map((e) => h`<option ${p && p.environment === e ? 'selected' : ''}>${e}</option>`)}</select></label>
        <label class="field"><span>Mode</span><select class="select" name="mode"><option value="live" ${p && p.mode === 'live' ? 'selected' : ''}>Live (real Salesforce + Jira)</option><option value="demo" ${p && p.mode === 'demo' ? 'selected' : ''}>Demo (simulator)</option></select></label>
        <label class="field"><span>Salesforce org alias</span><input class="input mono" name="sfOrg" value="${p ? p.sfOrg || '' : ''}" placeholder="acme--qa"></label>
        <label class="field"><span>API version</span><input class="input mono" name="apiVersion" value="${p ? p.apiVersion : '62.0'}" placeholder="62.0"></label>
        <label class="field full"><span>Instance URL</span><input class="input mono" name="instanceUrl" value="${p ? p.instanceUrl || '' : ''}" placeholder="https://your-org--qa.sandbox.my.salesforce.com"></label>
        <label class="field"><span>Credential prefix</span><input class="input mono" name="credentialRef" value="${p ? p.credentialRef || '' : ''}" placeholder="ACME_QA"><small>Reads SF_&lt;PREFIX&gt;_CLIENT_ID, …_CLIENT_SECRET, etc.</small></label>
        <label class="field"><span>Jira project key</span><input class="input mono" name="jiraProjectKey" value="${p ? p.jiraProjectKey || '' : ''}" placeholder="PROJ"></label>
        <label class="field"><span>Jira URL</span><input class="input mono" name="jiraUrl" value="${p ? p.jiraUrl || '' : ''}" placeholder="https://your-company.atlassian.net"></label>
        <label class="field"><span>Jira credential prefix (optional)</span><input class="input mono" name="jiraCredentialRef" value="${p ? p.jiraCredentialRef || '' : ''}" placeholder="Uses JIRA_EMAIL / JIRA_API_TOKEN"></label>
        <label class="field full"><span>Description</span><input class="input" name="description" value="${p ? p.description || '' : ''}"></label>
      </div>`,
      foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>${p ? 'Save project' : 'Create project'}</button>`,
      onMount(el, close) {
        el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
          const b = {};
          el.querySelectorAll('[name]').forEach((i) => { b[i.name] = i.value.trim() || null; });
          if (!b.name) { toast('Project name is required.', 'warn'); return; }
          try {
            const r = p ? await api.put(`/api/projects/${p.id}`, b) : await api.post('/api/projects', b);
            close();
            toast(`${r.name} ${p ? 'saved' : 'created'}.`, 'ok');
            await QA.state.reloadProjects();
            if (!p) QA.state.setProject(r.id);
            QA.router.go(`/projects/${r.id}`);
          } catch (err) { toastError(err, 'Project not saved'); }
        }));
      },
    });
  }

  async function renderDetail(view, id, tabQ) {
    QA.router.setCrumbs([{ label: 'Projects', href: '/projects' }, { label: id }]);
    view.innerHTML = String(loading(10));
    let p; let conn;
    try { [p, conn] = await Promise.all([api.get(`/api/projects/${encodeURIComponent(id)}`), api.get(`/api/projects/${encodeURIComponent(id)}/connection`)]); } catch (e) { view.innerHTML = String(errorBox(e)); return null; }
    QA.router.setCrumbs([{ label: 'Projects', href: '/projects' }, { label: p.name }]);
    let tab = tabQ || 'overview';
    const cfgTabs = { integration: ['integrationConfig', 'Integration endpoints, middleware and mappings used to generate integration tests.'], business: ['businessConfig', 'SLA, critical objects, low-privilege expectations and SOQL templates. These drive prioritisation and security tests.'], testdata: ['testDataConfig', 'Automatic cleanup and default variables available to tests as {{name}}.'], notifications: ['notificationConfig', 'Who is notified when runs complete.'] };
    view.innerHTML = String(h`${C.pageHead(p.name, h`${p.environment} · ${p.sfOrg || 'no org alias'} · API v${p.apiVersion} · ${p.mode} mode`,
      h`${p.id !== QA.state.projectId ? h`<button class="btn" data-act="use">Switch to this project</button>` : h`<span class="tag">Current project</span>`}<button class="btn" data-act="edit">${ic('edit')} Edit</button><button class="btn danger-outline" data-act="archive">Archive</button>`)}
      ${p.environment === 'Production' ? h`<div class="callout error" style="margin-bottom:16px">${ic('shield')}<div class="small"><b>Production project.</b> Read-only by default. Generated suites contain read-only smoke tests; any write requires explicit confirmation and DELETE a second confirmation. Test data is never created or deleted automatically.</div></div>` : ''}
      <div data-tabs></div><div data-pane></div>`);
    const TABS = [{ id: 'overview', label: 'Overview' }, { id: 'connection', label: 'Connections' }, { id: 'integration', label: 'Integration' }, { id: 'business', label: 'Business rules' }, { id: 'testdata', label: 'Test data' }, { id: 'notifications', label: 'Notifications' }];
    const pane = view.querySelector('[data-pane]');
    const draw = () => {
      view.querySelector('[data-tabs]').innerHTML = String(C.tabs(TABS, tab));
      if (tab === 'overview') {
        pane.innerHTML = String(h`<div class="grid g-2"><div class="card"><div class="card-head"><h2>Configuration</h2></div><div class="card-body">${C.kv([['Project id', h`<span class="mono">${p.id}</span>`], ['Environment', p.environment], ['Salesforce org', p.sfOrg], ['Instance URL', p.instanceUrl ? h`<span class="mono small">${p.instanceUrl}</span>` : null], ['API version', p.apiVersion], ['Jira project', p.jiraProjectKey], ['Jira URL', p.jiraUrl], ['Postman collection', p.postmanCollection ? h`<span class="mono small">${p.postmanCollection}</span>` : null], ['Automation repo', p.automationRepo], ['Created', fmt.date(p.createdAt)]])}</div></div>
          <div class="card"><div class="card-head"><h2>Activity</h2></div><div class="card-body">${C.kv([['Test cases', fmt.num(p.stats.tests)], ['Last run', p.stats.lastRun ? h`<a href="/execution/${p.stats.lastRun.id}" data-link class="mono">${p.stats.lastRun.id}</a> · ${p.stats.lastRun.passed}/${p.stats.lastRun.total} passed · ${fmt.ago(p.stats.lastRun.startedAt)}` : 'Never'], ['Pass rate (last run)', p.stats.passRate === null || p.stats.passRate === undefined ? '–' : `${p.stats.passRate}%`], ['Salesforce', connDot(p.connection.salesforce)], ['Jira', connDot(p.connection.jira)], ['Metadata provenance', prov(p.connection.metadataLabel)]])}</div></div></div>`);
      } else if (tab === 'connection') {
        const c = conn.credentials;
        const pre = c.salesforce.prefix || 'SF_<PREFIX>_';
        const row = (name, present, note) => h`<tr><td class="mono small">${name}</td><td>${present ? h`<span class="badge ok">Set</span>` : h`<span class="badge plain">Not set</span>`}</td><td class="small muted">${note || ''}</td></tr>`;
        pane.innerHTML = String(h`${C.connectionNotice(p)}<div class="grid g-2">
          <div class="card"><div class="card-head"><h2>Salesforce credentials</h2>${connDot(p.connection.salesforce)}</div><div class="card-body flush"><div class="table-wrap"><table class="t"><thead><tr><th>Environment variable</th><th>Status</th><th>Purpose</th></tr></thead><tbody>
            ${row(`${pre}AUTH_FLOW`, Boolean(c.salesforce.authFlow), c.salesforce.authFlow ? `Flow: ${c.salesforce.authFlow}` : 'client_credentials | jwt | refresh_token')}
            ${row(`${pre}CLIENT_ID`, c.salesforce.clientId, 'Connected app consumer key')}
            ${row(`${pre}CLIENT_SECRET`, c.salesforce.clientSecret, 'client_credentials / refresh_token flows')}
            ${row(`${pre}USERNAME`, c.salesforce.username, 'JWT bearer flow')}
            ${row(`${pre}PRIVATE_KEY_PATH`, c.salesforce.privateKey, 'JWT bearer flow (path to .pem, never the key itself)')}
            ${row(`${pre}REFRESH_TOKEN`, c.salesforce.refreshToken, 'refresh_token flow')}
            ${row(`${pre}LOWPRIV_*`, c.salesforce.lowPrivilegeUser, 'Optional low-privilege user for security tests')}
          </tbody></table></div></div></div>
          <div class="card"><div class="card-head"><h2>Jira credentials</h2>${connDot(p.connection.jira)}</div><div class="card-body flush"><div class="table-wrap"><table class="t"><thead><tr><th>Environment variable</th><th>Status</th><th>Purpose</th></tr></thead><tbody>
            ${row(`${c.jira.prefix || 'JIRA_'}EMAIL`, c.jira.configured, 'Atlassian account email')}
            ${row(`${c.jira.prefix || 'JIRA_'}API_TOKEN`, c.jira.configured, 'Atlassian API token')}
          </tbody></table></div><div class="card-body small muted">Only presence is shown. Values are never sent to the browser, logged or written to reports.</div></div></div></div>
          <div class="row mt"><button class="btn primary" data-act="test">${ic('refresh')} Test connections</button><span class="small muted">Calls the Salesforce limits endpoint and Jira /myself with the configured credentials.</span></div><div data-testout class="mt"></div>`);
      } else {
        const [field, help] = cfgTabs[tab];
        pane.innerHTML = String(h`<div class="card"><div class="card-head"><h2>${TABS.find((t) => t.id === tab).label}</h2><span class="small muted">${help}</span></div><div class="card-body">
          <textarea class="input mono" rows="22" data-cfg spellcheck="false" aria-label="${field} JSON">${JSON.stringify(p[field] || {}, null, 2)}</textarea>
          <div class="row mt"><span class="small muted">Secret-looking keys (password, secret, token) are rejected by the server.</span><span class="spacer"></span><button class="btn primary" data-save="${field}">Save</button></div></div></div>`);
      }
    };
    draw();
    on(view, 'click', '[data-tab]', (e, el) => { tab = el.dataset.tab; QA.router.setQuery({ tab: tab === 'overview' ? '' : tab }); draw(); });
    on(view, 'click', '[data-act=edit]', () => projectForm(p));
    on(view, 'click', '[data-act=use]', () => { QA.state.setProject(p.id); });
    on(view, 'click', '[data-act=archive]', async () => {
      const ok = await confirm({ title: `Archive ${p.name}?`, message: 'The project is hidden from switchers and dashboards. History is kept.', confirmLabel: 'Archive', danger: true, typeToConfirm: p.id });
      if (!ok) return;
      try { await api.del(`/api/projects/${p.id}`); toast(`${p.name} archived.`, 'warn'); await QA.state.reloadProjects(); QA.router.go('/projects'); } catch (err) { toastError(err); }
    });
    on(view, 'click', '[data-save]', (e, el) => withBusy(el, async () => {
      let v;
      try { v = JSON.parse(pane.querySelector('[data-cfg]').value); } catch (err) { toastError({ message: `Invalid JSON: ${err.message}`, info: { action: 'Fix the JSON syntax and save again.' } }, 'Not saved'); return; }
      try { p = await api.put(`/api/projects/${p.id}`, { [el.dataset.save]: v }); toast('Configuration saved.', 'ok'); QA.state.reloadProjects(); } catch (err) { toastError(err, 'Not saved'); }
    }));
    on(view, 'click', '[data-act=test]', (e, el) => withBusy(el, async () => {
      const out = pane.querySelector('[data-testout]');
      try {
        const r = await api.post(`/api/projects/${p.id}/connection/test`);
        const block = (name, x) => (x.ok ? h`<div class="callout ok">${ic('check')}<div><b>${name}: connected</b><div class="small">${Object.entries(x).filter(([k]) => !['ok'].includes(k)).map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' · ')}</div></div></div>` : errorBox({ message: `${name}: ${x.title || 'not connected'}`, info: x }));
        out.innerHTML = String(h`<div class="grid g-2">${block('Salesforce', r.salesforce)}${block('Jira', r.jira)}</div>`);
      } catch (err) { out.innerHTML = String(errorBox(err)); }
    }));
    return null;
  }
})();

  <script>/* API explorer: request builder for every Salesforce API, object discovery, SOQL, save/convert to test. */
(() => {
  const QA = window.QA;
  const { h, raw, ic, fmt, badge, prov, method, on, errorBox, loading, empty, toast, toastError, withBusy, esc, modal, json, debounce } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  const J = (v) => (v === undefined || v === null || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length) ? '' : typeof v === 'string' ? v : JSON.stringify(v, null, 2));

  QA.pages.explorer = {
    async render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'API explorer' }]);
      const state = { side: ctx.query.object ? 'objects' : 'templates', req: { method: 'GET', path: '/services/data/v{{apiVersion}}/limits', auth: 'default', headers: '', query: '', body: '', variables: '', apiType: 'REST' }, last: null, object: ctx.query.object || null };

      view.innerHTML = String(h`${C.pageHead('API explorer', h`Send requests to ${p.name} (${p.environment}). Authentication is injected from the secret store; the Authorization header is never shown or accepted.`)}
        ${C.connectionNotice(p)}
        <div class="split" style="grid-template-columns:280px minmax(0,1fr)">
          <aside class="card" style="align-self:start;position:sticky;top:72px;max-height:calc(100vh - 96px);overflow:auto">
            <div class="toolbar" style="padding:8px">${C.tabs([{ id: 'templates', label: 'Templates' }, { id: 'saved', label: 'Saved' }, { id: 'objects', label: 'Objects' }], state.side, 'data-side')}</div>
            <div data-side-body>${loading(8)}</div>
          </aside>
          <div class="stack" style="min-width:0">
            <div class="card"><div class="card-body">
              <div class="row" style="gap:8px;flex-wrap:wrap">
                <select class="select" name="method" aria-label="Method" style="width:110px">${['GET', 'POST', 'PATCH', 'PUT', 'DELETE', 'HEAD'].map((m) => h`<option>${m}</option>`)}</select>
                <input class="input mono" name="path" aria-label="Endpoint path" style="flex:1;min-width:260px">
                <select class="select" name="auth" aria-label="Authentication" style="width:190px">${[['default', 'Integration user'], ['lowpriv', 'Low-privilege user'], ['none', 'No token'], ['invalid', 'Invalid token']].map(([v, l]) => h`<option value="${v}">${l}</option>`)}</select>
                <button class="btn primary" data-act="send">${ic('send')} Send</button>
              </div>
              <div class="mt" data-reqtabs>${C.tabs([{ id: 'body', label: 'Body' }, { id: 'query', label: 'Query' }, { id: 'headers', label: 'Headers' }, { id: 'variables', label: 'Variables' }], 'body', 'data-rt')}</div>
              ${['body', 'query', 'headers', 'variables'].map((k) => h`<div data-rp="${k}" class="${k === 'body' ? '' : 'hidden'}"><textarea class="input mono" rows="${k === 'body' ? 10 : 5}" name="${k}" spellcheck="false" placeholder="${{ body: 'JSON, XML (SOAP) or CSV body', query: '{ "q": "SELECT Id FROM Account LIMIT 5" }', headers: '{ "Sforce-Call-Options": "client=qa-platform" } — no Authorization header', variables: '{ "accountId": "001..." }  — {{apiVersion}} and {{$uuid}} etc. resolve automatically' }[k]}"></textarea></div>`)}
              <div class="row mt" style="gap:8px"><span class="small muted" data-reqhint></span><span class="spacer"></span><button class="btn sm" data-act="save">${ic('plus')} Save request</button><button class="btn sm" data-act="totest" disabled>${ic('wand')} Create test case from response</button></div>
            </div></div>
            <div class="card" data-response>${empty({ icon: 'send', title: 'No request sent yet', text: 'Choose a template or object on the left, or type an endpoint, then click Send.' })}</div>

      const f = (n) => view.querySelector(`[name=${n}]`);

      };
      setReq(state.req);
      on(view, 'click', '[data-rt]', (e, el) => { view.querySelector('[data-reqtabs]').innerHTML = String(C.tabs([{ id: 'body', label: 'Body' }, { id: 'query', label: 'Query' }, { id: 'headers', label: 'Headers' }, { id: 'variables', label: 'Variables' }], el.dataset.rt, 'data-rt')); view.querySelectorAll('[data-rp]').forEach((x) => x.classList.toggle('hidden', x.dataset.rp !== el.dataset.rt)); });

      // Sidebar
      const sideBody = view.querySelector('[data-side-body]');
      let templates = []; let saved = []; let objects = null;
      async function drawSide() {
        view.querySelector('[data-side]') && (view.querySelector('aside .toolbar').innerHTML = String(C.tabs([{ id: 'templates', label: 'Templates' }, { id: 'saved', label: 'Saved' }, { id: 'objects', label: 'Objects' }], state.side, 'data-side')));
        try {
          if (state.side === 'templates') {
            if (!templates.length) templates = await api.get('/api/explorer/templates', { cacheMs: 600000 });
            const groups = templates.reduce((m, t, i) => { (m[t.group] = m[t.group] || []).push({ ...t, i }); return m; }, {});
            sideBody.innerHTML = String(h`<div class="side-list">${Object.entries(groups).map(([g, items]) => h`<div class="side-group">${g}</div>${items.map((t) => h`<button class="item" data-tpl="${t.i}">${method(t.method)}<span class="truncate">${t.name}</span></button>`)}`)}</div>`);
          } else if (state.side === 'saved') {
            saved = await api.get(`/api/requests?projectId=${p.id}`);
            const groups = saved.reduce((m, t) => { (m[t.collection || 'Default'] = m[t.collection || 'Default'] || []).push(t); return m; }, {});
            sideBody.innerHTML = String(saved.length ? h`<div class="side-list">${Object.entries(groups).map(([g, items]) => h`<div class="side-group">${g}</div>${items.map((t) => h`<div class="item" style="display:flex;gap:6px;align-items:center"><button class="btn ghost xs" style="flex:1;justify-content:flex-start;min-width:0" data-saved="${t.id}">${method(t.method)}<span class="truncate">${t.name}</span></button><button class="btn ghost xs" data-delsaved="${t.id}" aria-label="Delete ${t.name}">${ic('x')}</button></div>`)}`)}</div>` : empty({ icon: 'inbox', title: 'No saved requests', text: 'Use "Save request" to keep requests for reuse.' }));
          } else {
            if (!objects) objects = await api.get(`/api/projects/${p.id}/sobjects`, { cacheMs: 300000 });
            sideBody.innerHTML = String(h`<div style="padding:8px"><input class="input search" type="search" placeholder="Filter objects" data-objq aria-label="Filter objects"><div class="small muted mt-s">${prov(objects.label)} ${objects.source}</div></div><div class="side-list" data-objlist>${raw(objList(''))}</div>`);
          }
        } catch (e) { sideBody.innerHTML = String(h`<div class="card-body">${errorBox(e, { compact: true })}</div>`); }
      }
      const objList = (q) => String(h`${objects.objects.filter((o) => !q || `${o.name} ${o.label}`.toLowerCase().includes(q.toLowerCase())).map((o) => h`<button class="item ${state.object === o.name ? 'on' : ''}" data-obj="${o.name}"><span class="truncate">${o.label}</span><span class="faint small mono" style="margin-left:auto">${o.name}</span></button>`)}`);
      on(view, 'click', '[data-side]', (e, el) => { state.side = el.dataset.side; drawSide(); });
      on(sideBody, 'input', '[data-objq]', debounce((e) => { sideBody.querySelector('[data-objlist]').innerHTML = objList(e.target.value); }, 150));
      on(sideBody, 'click', '[data-tpl]', (e, el) => { const t = templates[Number(el.dataset.tpl)]; setReq({ method: t.method, path: t.path, body: t.body || '', query: t.query || '', headers: t.headers || '', apiType: t.apiType || t.group, note: t.note || `${t.group} · ${t.name}`, auth: 'default' }); });
      on(sideBody, 'click', '[data-saved]', (e, el) => { const t = saved.find((x) => x.id === el.dataset.saved); setReq({ method: t.method, path: t.path, body: t.body || '', query: t.query || '', headers: t.headers || '', auth: t.auth, apiType: t.apiType, note: `Saved: ${t.name}` }); });
      on(sideBody, 'click', '[data-delsaved]', async (e, el) => { try { await api.del(`/api/requests/${el.dataset.delsaved}`); toast('Saved request deleted.', 'warn'); drawSide(); } catch (err) { toastError(err); } });
      on(sideBody, 'click', '[data-obj]', (e, el) => { state.object = el.dataset.obj; QA.router.setQuery({ object: state.object }); sideBody.querySelectorAll('[data-obj]').forEach((b) => b.classList.toggle('on', b === el)); describeObject(state.object); });
      drawSide();

      // Object describe panel (replaces response area)
      async function describeObject(name) {
        const box = view.querySelector('[data-response]');
        box.innerHTML = String(loading(8));
        try {
          const d = await api.get(`/api/projects/${p.id}/sobjects/${encodeURIComponent(name)}`, { cacheMs: 300000 });
          const v = `/services/data/v{{apiVersion}}`;
          box.innerHTML = String(h`<div class="card-head"><h2>${d.label} <span class="sub mono">${d.name}</span></h2><div class="row">${prov(d.label === 'VERIFIED' || d.label === 'ASSUMED' ? d.label : objects && objects.label)}<span class="small muted">key prefix ${d.keyPrefix || '–'}</span></div></div>
            <div class="card-body"><div class="row wrap" style="gap:8px">
              <button class="btn sm" data-quick="describe">${method('GET')} Describe</button>
              <button class="btn sm" data-quick="query">${method('GET')} Query 5 records</button>
              ${d.createable ? h`<button class="btn sm" data-quick="create">${method('POST')} Create (required fields)</button>` : ''}
              <span class="spacer"></span><span class="small muted">${[d.createable && 'create', d.updateable && 'update', d.deletable && 'delete', d.queryable && 'query'].filter(Boolean).join(' · ')}</span></div>
              ${objects && objects.label === 'ASSUMED' ? h`<div class="callout warn mt">${ic('alert')}<div class="small">This describe comes from the demo simulator. Field names and rules are ASSUMED, not verified facts about your org.</div></div>` : ''}</div>
            ${QA.ui.table({ rows: d.fields, columns: [
              { key: 'name', label: 'Field', render: (x) => h`<div class="mono small">${x.name}</div><div class="cell-sub">${x.label}</div>` },
              { key: 'type', label: 'Type', render: (x) => h`<span class="small">${x.type}${x.length ? `(${x.length})` : x.precision ? `(${x.precision},${x.scale})` : ''}</span>${x.referenceTo && x.referenceTo.length ? h`<div class="cell-sub">→ ${x.referenceTo.join(', ')}</div>` : ''}` },
              { key: 'flags', label: 'Properties', render: (x) => h`${x.required ? h`<span class="tag" style="color:var(--error-text)">required</span>` : ''}${x.unique ? h`<span class="tag">unique</span>` : ''}${x.externalId ? h`<span class="tag">external id</span>` : ''}${!x.createable && !x.updateable ? h`<span class="tag">read-only</span>` : ''}${x.calculated ? h`<span class="tag">formula</span>` : ''}${x.pii ? h`<span class="tag">PII</span>` : ''}` },
              { key: 'picklist', label: 'Picklist values', render: (x) => h`<span class="small muted">${(x.picklistValues || []).map((pv) => pv.value || pv).slice(0, 6).join(', ')}${(x.picklistValues || []).length > 6 ? '…' : ''}</span>` },
            ] })}`);
          state.describe = d;
          if (box.__quickBound) return;
          box.__quickBound = true;
          on(box, 'click', '[data-quick]', (e, el) => {
            const d = state.describe; const v = '/services/data/v{{apiVersion}}';
            const k = el.dataset.quick;
            if (k === 'describe') setReq({ method: 'GET', path: `${v}/sobjects/${d.name}/describe`, body: '', query: '', note: `Describe ${d.name}` });
            if (k === 'query') setReq({ method: 'GET', path: `${v}/query`, query: { q: `SELECT ${['Id', ...d.fields.filter((x) => x.name !== 'Id' && ['string', 'picklist', 'email', 'phone', 'currency', 'double', 'date'].includes(x.type)).slice(0, 4).map((x) => x.name)].join(', ')} FROM ${d.name} ORDER BY CreatedDate DESC LIMIT 5` }, body: '', note: `SOQL on ${d.name}` });
            if (k === 'create') {
              const body = {};
              d.fields.filter((x) => x.required && x.createable && x.type !== 'reference').forEach((x) => { body[x.name] = x.type === 'picklist' && x.picklistValues[0] ? (x.picklistValues[0].value || x.picklistValues[0]) : x.type === 'email' ? '{{$randomEmail}}' : x.type === 'double' || x.type === 'currency' ? 1 : x.type === 'date' ? '{{$today}}' : `QA ${x.label} {{$timestamp}}`; });
              setReq({ method: 'POST', path: `${v}/sobjects/${d.name}`, body, query: '', note: `Create ${d.name} with required fields (${Object.keys(body).join(', ') || 'none detected'})` });
            }
          });
        } catch (e) { box.innerHTML = String(h`<div class="card-body">${errorBox(e)}</div>`); }
      }
      if (state.object) describeObject(state.object);

      // Prefill from a result or saved request id
      if (ctx.query.fromResult) {
        try {
          const r = await api.get(`/api/results/${encodeURIComponent(ctx.query.fromResult)}`);
          const u = new URL(r.request.url);
          const path = u.pathname.replace(`/v${p.apiVersion}/`, '/v{{apiVersion}}/');
          const q = Object.fromEntries(u.searchParams);
          const hd = { ...(r.request.headers || {}) }; delete hd.Authorization; delete hd.authorization;
          setReq({ method: r.request.method, path, query: Object.keys(q).length ? q : r.request.query, headers: hd, body: r.request.body, auth: r.request.auth || 'default', note: `Loaded from result ${r.id}` });
        } catch (e) { toastError(e, 'Could not load result'); }
      }

      const parse = (k, label) => { const t = f(k).value.trim(); if (!t) return undefined; try { return JSON.parse(t); } catch (e) { throw Object.assign(new Error(`${label} must be valid JSON: ${e.message}`), { info: { action: `Fix the ${label} tab.` } }); } };
      const collect = () => ({ method: f('method').value, path: f('path').value.trim(), auth: f('auth').value, headers: parse('headers', 'Headers') || {}, query: parse('query', 'Query') || {}, variables: parse('variables', 'Variables') || {}, body: f('body').value, apiType: state.req.apiType });

      on(view, 'click', '[data-act=send]', (e, el) => withBusy(el, async () => {
        let b;
        try { b = collect(); } catch (err) { toastError(err, 'Request not sent'); return; }
        const box = view.querySelector('[data-response]');
        try {
          const r = await C.withProductionSafety((conf) => api.post(`/api/explorer/execute?projectId=${p.id}`, { ...b, ...conf }));
          if (!r) return;
          state.last = { req: b, res: r };
          view.querySelector('[data-act=totest]').disabled = false;
          drawResponse(box, r);
        } catch (err) { box.innerHTML = String(h`<div class="card-body">${errorBox(err)}</div>`); }
      }));
      view.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') view.querySelector('[data-act=send]').click(); });

      on(view, 'click', '[data-act=save]', () => {
        let b;
        try { b = collect(); } catch (err) { toastError(err); return; }
        modal({
          title: 'Save request', body: h`<div class="form-grid"><label class="field"><span>Name</span><input class="input" name="sname" value="${b.method} ${fmt.shortPath(b.path)}"></label><label class="field"><span>Collection</span><input class="input" name="scoll" value="Default"></label></div>`,
          foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Save</button>`,
          onMount(el, close) {
            el.querySelector('[data-go]').addEventListener('click', async () => {
              let body = b.body; try { body = b.body.trim() ? JSON.parse(b.body) : null; } catch { /* keep raw */ }
              try { await api.post(`/api/requests?projectId=${p.id}`, { name: el.querySelector('[name=sname]').value, collection: el.querySelector('[name=scoll]').value, method: b.method, path: b.path, headers: b.headers, query: b.query, body, auth: b.auth, apiType: b.apiType }); close(); toast('Request saved.', 'ok'); if (state.side === 'saved') drawSide(); } catch (err) { toastError(err); }
            });
          },
        });
      });

      on(view, 'click', '[data-act=totest]', (e, el) => withBusy(el, async () => {
        if (!state.last) return;
        try {
          const draft = await api.post(`/api/explorer/generate-test?projectId=${p.id}`, { ...state.last.req, response: state.last.res.response });
          modal({
            title: 'Create test case', subtitle: 'Review the generated assertions. The test is saved as ASSUMED until verified against a live org.', size: 'wide',
            body: h`<div class="form-grid"><label class="field full"><span>Title</span><input class="input" name="title" value="${draft.title}"></label><label class="field"><span>Test type</span><input class="input" value="${draft.testType}" disabled></label><label class="field"><span>Priority</span><input class="input" value="${draft.priority}" disabled></label><label class="field full"><span>Story key (optional)</span><input class="input mono" name="storyKey"></label><label class="field full"><span>Assertions</span><textarea class="input mono" rows="10" name="assertions">${JSON.stringify(draft.assertions, null, 2)}</textarea></label></div>`,
            foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Create test case</button>`,
            onMount(m, close) {
              m.querySelector('[data-go]').addEventListener('click', async (ev) => withBusy(ev.currentTarget, async () => {
                try {
                  const t = await api.post(`/api/testcases?projectId=${p.id}`, { ...draft, title: m.querySelector('[name=title]').value, storyKey: m.querySelector('[name=storyKey]').value.trim() || null, assertions: JSON.parse(m.querySelector('[name=assertions]').value) });
                  close(); toast(h`${t.id} created. <a href="/testcases?id=${t.id}" data-link>Open</a>`, 'ok', 'Test case created');
                } catch (err) { toastError(err, 'Not created'); }
              }));
            },
          });
        } catch (err) { toastError(err); }
      }));
      return null;
    },
  };

  function drawResponse(box, r) {
    const res = r.response;
    const x = r.explanation || {};
    const view = C.exchangeView({ request: r.request, response: res, assertions: r.assertions, correlationId: res.correlationId, status: res.status < 400 ? 'passed' : 'failed' });
    box.innerHTML = String(h`<div class="card-head"><h2>Response</h2><div class="row" style="gap:14px"><span>${C.statusCode(res.status)}</span><span class="small muted">${fmt.ms(res.timeMs)} · ${fmt.bytes(res.sizeBytes)}</span>${r.demo ? h`<span class="badge demo">Demo org</span>` : ''}</div></div>
      ${res.status >= 400 && x.title ? h`<div class="card-body" style="padding-bottom:0">${errorBox({ message: `${x.code ? `${x.code}: ` : ''}${x.title}`, info: x })}</div>` : ''}
      <div class="card-body">${view.html}</div>`);
    view.bind(box);
  }
})();
</script>
  <script>/* Jira stories: list, story detail, and the generate → review → approve workflow. */
(() => {
  const QA = window.QA;
  const { h, raw, ic, fmt, badge, prov, pri, method, on, errorBox, loading, empty, toast, toastError, withBusy, esc, modal, json } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.stories = {
    render(view, ctx) {
      if (!QA.state.project) { view.innerHTML = String(C.projectRequired()); return null; }
      if (ctx.pattern === '/generate/:id') return renderProposal(view, ctx.params.id, null);
      if (ctx.params.key && ctx.query.proposal) return renderProposal(view, ctx.query.proposal, ctx.params.key);
      if (ctx.params.key) return renderStory(view, ctx.params.key);
      return renderList(view, ctx);
    },
  };

  const coverageBar = (c) => {
    if (!c || !c.tests) return h`<span class="faint small">No tests</span>`;
    return h`<div class="progress" style="width:120px" title="${c.passed} passed, ${c.failed} failed, ${c.blocked} blocked of ${c.tests}"><span style="width:${(c.passed / c.tests) * 100}%;background:var(--success)"></span><span style="width:${(c.failed / c.tests) * 100}%;background:var(--error)"></span><span style="width:${(c.blocked / c.tests) * 100}%;background:var(--warning)"></span></div><div class="cell-sub num">${c.tests} tests · ${c.executed} executed</div>`;
  };

  // ── List ──
  function renderList(view, ctx) {
    const p = QA.state.project;
    QA.router.setCrumbs([{ label: 'Jira stories' }]);
    const jira = p.connection && p.connection.jira;
    view.innerHTML = String(h`${C.pageHead('Jira stories', h`Stories from ${p.jiraProjectKey || 'Jira'} (${jira ? jira.label : 'not configured'}). Generate API tests from a story, review them, then approve.`,
      h`<button class="btn" data-act="add">${ic('plus')} Add story</button><button class="btn primary" data-act="sync">${ic('refresh')} Sync from Jira</button>`)}
      <div data-list></div>`);
    let sprints = [];
    const list = C.listController(view.querySelector('[data-list]'), {
      sort: 'key', dir: 'ASC', searchPlaceholder: 'Search key, summary or description', filters: { sprint: ctx.query.sprint || '' },
      toolbar: (s) => h`<select class="select" data-filter="sprint" aria-label="Sprint"><option value="">All sprints</option>${sprints.map((x) => h`<option ${s.filters.sprint === x ? 'selected' : ''}>${x}</option>`)}</select>`,
      fetch: async (q) => { const r = await api.get(`/api/stories${api.qs({ projectId: p.id, ...q })}`); if (r.sprints && r.sprints.join() !== sprints.join()) { sprints = r.sprints; setTimeout(() => list.renderToolbar(), 0); } return r; },
      rowAttrs: (r) => `data-id="${esc(r.id)}"`,
      onRow: (r) => QA.router.go(`/stories/${r.key}`),
      emptyState: () => empty({ icon: 'jira', title: 'No stories yet', text: 'Sync stories from Jira with a JQL query, or add one manually.', action: h`<button class="btn primary" data-act="sync">${ic('refresh')} Sync from Jira</button>` }),
      columns: [
        { key: 'key', label: 'Key', sortable: true, render: (r) => h`<b class="mono small">${r.key}</b>` },
        { key: 'summary', label: 'Summary', sortable: true, render: (r) => h`<div class="cell-title">${r.summary}</div><div class="cell-sub">${(r.components || []).join(', ')}${r.assignee ? ` · ${r.assignee}` : ''}</div>` },
        { key: 'status', label: 'Status', sortable: true, render: (r) => h`<span class="tag">${r.status}</span>` },
        { key: 'priority', label: 'Priority', sortable: true },
        { key: 'sprint', label: 'Sprint', sortable: true },
        { key: 'coverage', label: 'API test coverage', render: (r) => coverageBar(r.coverage) },
        { key: 'defects', label: 'Defects', cls: 'num', render: (r) => (r.defects ? h`<span class="text-error">${r.defects}</span>` : '0') },
        { key: 'actions', label: '', cls: 'actions', render: (r) => h`<button class="btn xs" data-gen="${r.key}">${ic('wand')} Generate</button>` },
      ],
    });
    on(view, 'click', '[data-gen]', (e, el) => generate(el.dataset.gen, el));
    on(view, 'click', '[data-act=sync]', () => syncDialog(list));
    on(view, 'click', '[data-act=add]', () => addDialog(list));
    return null;
  }

  function syncDialog(list) {
    const p = QA.state.project;
    modal({
      title: 'Sync stories from Jira', subtitle: `Reads issues from ${p.jiraProjectKey}. Nothing is written to Jira.`,
      body: h`<label class="field"><span>JQL (optional)</span><textarea class="input mono" rows="3" name="jql" placeholder="project = ${p.jiraProjectKey} AND issuetype = Story AND sprint in openSprints()"></textarea><small>Leave empty to fetch recent stories in ${p.jiraProjectKey}.</small></label>`,
      foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>${ic('refresh')} Sync</button>`,
      onMount(el, close) {
        el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
          try { const r = await api.post(`/api/stories/sync?projectId=${p.id}`, { jql: el.querySelector('[name=jql]').value.trim() || undefined }); close(); toast(`${r.synced} stories synced from Jira.`, 'ok', 'Sync complete'); list.reload(); } catch (err) { toastError(err, 'Sync failed'); }
        }));
      },
    });
  }

  function addDialog(list) {
    const p = QA.state.project;
    modal({
      title: 'Add story manually', subtitle: 'Use this when Jira is unavailable. The story stays local to this platform.', size: 'wide',
      body: h`<div class="form-grid"><label class="field"><span>Key</span><input class="input mono" name="key" placeholder="${p.jiraProjectKey || 'PROJ'}-123" required></label>
        <label class="field"><span>Sprint</span><input class="input" name="sprint"></label>
        <label class="field full"><span>Summary</span><input class="input" name="summary" required></label>
        <label class="field full"><span>Description</span><textarea class="input" rows="4" name="description"></textarea></label>
        <label class="field full"><span>Acceptance criteria (one per line)</span><textarea class="input" rows="5" name="acceptanceCriteria"></textarea></label></div>`,
      foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Add story</button>`,
      onMount(el, close) {
        el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
          const v = (n) => el.querySelector(`[name=${n}]`).value.trim();
          try { const s = await api.post(`/api/stories?projectId=${p.id}`, { key: v('key').toUpperCase(), summary: v('summary'), sprint: v('sprint') || null, description: v('description'), acceptanceCriteria: v('acceptanceCriteria'), status: 'To Do', issueType: 'Story' }); close(); toast(`${s.key} added.`, 'ok'); list.reload(); } catch (err) { toastError(err, 'Story not added'); }
        }));
      },
    });
  }

  async function generate(storyKey, btn) {
    const p = QA.state.project;
    return withBusy(btn, async () => {
      try {
        const pr = await api.post(`/api/generate?projectId=${p.id}`, { storyKey });
        QA.router.go(`/stories/${storyKey}?proposal=${pr.id}`);
      } catch (e) { toastError(e, 'Generation failed'); }
    });
  }

  // ── Story detail ──
  async function renderStory(view, key) {
    const p = QA.state.project;
    QA.router.setCrumbs([{ label: 'Jira stories', href: '/stories' }, { label: key }]);
    view.innerHTML = String(loading(10));
    let s;
    try { s = await api.get(`/api/stories/${encodeURIComponent(key)}?projectId=${p.id}`); } catch (e) { view.innerHTML = String(errorBox(e)); return null; }
    const cov = s.coverage || { tests: 0, passed: 0, failed: 0, blocked: 0, executed: 0 };
    let tab = 'tests';
    const ac = String(s.acceptanceCriteria || '').split('\n').map((x) => x.replace(/^\s*[-*•]\s*/, '').trim()).filter(Boolean);
    view.innerHTML = String(h`${C.pageHead(h`<span class="mono" style="font-size:20px">${s.key}</span> ${s.summary}`, h`${s.issueType || 'Story'} · ${s.status} · ${s.priority || 'No priority'} · ${s.sprint || 'No sprint'}${s.assignee ? ` · ${s.assignee}` : ''} · synced ${fmt.ago(s.syncedAt)}`,
        h`${s.url ? h`<a class="btn" href="${s.url}" target="_blank" rel="noopener">${ic('external')} Open in Jira</a>` : ''}<button class="btn" data-act="impact">${ic('target')} Regression impact</button><button class="btn" data-act="run" ${cov.tests ? '' : 'disabled'}>${ic('play')} Run story tests</button><button class="btn primary" data-act="gen">${ic('wand')} Generate API tests</button>`)}
      <div class="grid g-21">
        <div class="card"><div class="card-head"><h2>Requirement</h2></div><div class="card-body">
          <p style="margin-top:0;white-space:pre-wrap">${s.description || 'No description.'}</p>
          <h3 class="mt">Acceptance criteria</h3>${ac.length ? h`<ol class="small" style="padding-left:18px;margin:8px 0 0">${ac.map((x) => h`<li style="margin-bottom:4px">${x}</li>`)}</ol>` : h`<p class="small muted">No acceptance criteria. Generated coverage will be marked RECOMMENDED where requirements are unclear.</p>`}
        </div></div>
        <div class="card"><div class="card-head"><h2>Coverage</h2></div><div class="card-body">
          ${C.kv([['Scenarios', fmt.num(s.scenarios.length)], ['Test cases', fmt.num(cov.tests)], ['Executed', fmt.num(cov.executed)], ['Passed', h`<span class="text-ok">${cov.passed}</span>`], ['Failed', cov.failed ? h`<span class="text-error">${cov.failed}</span>` : '0'], ['Blocked', fmt.num(cov.blocked)], ['Defects', fmt.num(s.defects.length)]])}
          <div class="mt">${coverageBar(cov)}</div>
        </div></div>
      </div>
      <div class="mt" data-tabs></div><div class="card" data-pane></div>`);

    const drawTabs = () => { view.querySelector('[data-tabs]').innerHTML = String(C.tabs([{ id: 'tests', label: 'Test cases', n: s.tests.length }, { id: 'scenarios', label: 'Scenarios', n: s.scenarios.length }, { id: 'defects', label: 'Defects', n: s.defects.length }, { id: 'proposals', label: 'Generation history', n: s.proposals.length }], tab)); };
    const pane = view.querySelector('[data-pane]');
    const drawPane = () => {
      if (tab === 'tests') pane.innerHTML = String(QA.ui.table({ rows: s.tests, rowAttrs: (r) => `data-tc="${esc(r.id)}"`, emptyState: empty({ icon: 'wand', title: 'No test cases for this story', text: 'Generate API tests to propose scenarios for review.' }), columns: [
        { key: 'id', label: 'Id', render: (r) => h`<span class="mono small">${r.id}</span>` },
        { key: 'title', label: 'Test case', render: (r) => h`<div class="cell-title">${r.title}</div><div class="cell-sub">${C.endpoint(r.method, r.endpoint)}</div>` },
        { key: 'testType', label: 'Type' }, { key: 'priority', label: 'Pri', render: (r) => pri(r.priority) },
        { key: 'label', label: 'Provenance', render: (r) => prov(r.label) },
        { key: 'lastResult', label: 'Last result', render: (r) => (r.lastResult ? badge(r.lastResult) : h`<span class="faint small">Not run</span>`) },
      ] }));
      else if (tab === 'scenarios') pane.innerHTML = String(QA.ui.table({ rows: s.scenarios, emptyState: empty({ title: 'No scenarios' }), columns: [
        { key: 'id', label: 'Id', render: (r) => h`<span class="mono small">${r.id}</span>` }, { key: 'title', label: 'Scenario', render: (r) => h`<div class="cell-title">${r.title}</div><div class="cell-sub">${r.description || ''}</div>` },
        { key: 'type', label: 'Type' }, { key: 'apiType', label: 'API' }, { key: 'priority', label: 'Pri', render: (r) => pri(r.priority) }, { key: 'label', label: 'Provenance', render: (r) => prov(r.label) },
      ] }));
      else if (tab === 'defects') pane.innerHTML = String(QA.ui.table({ rows: s.defects, emptyState: empty({ icon: 'bug', title: 'No defects linked', text: 'Defects created from failed tests are linked to this story.' }), columns: [
        { key: 'key', label: 'Key', render: (r) => (r.url ? h`<a href="${r.url}" target="_blank" rel="noopener">${r.key}</a>` : r.key) }, { key: 'summary', label: 'Summary' }, { key: 'severity', label: 'Severity', render: (r) => badge(r.severity) }, { key: 'status', label: 'Status', render: (r) => badge(r.status) },
      ] }));
      else pane.innerHTML = String(QA.ui.table({ rows: s.proposals, rowAttrs: (r) => `data-prop="${esc(r.id)}"`, emptyState: empty({ title: 'No generation history' }), columns: [
        { key: 'id', label: 'Proposal', render: (r) => h`<span class="mono small">${r.id}</span>` }, { key: 'status', label: 'Status', render: (r) => badge(r.status) }, { key: 'createdAt', label: 'Generated', render: (r) => fmt.date(r.createdAt) }, { key: 'decidedAt', label: 'Decided', render: (r) => fmt.date(r.decidedAt) },
      ] }));
    };
    drawTabs(); drawPane();
    on(view, 'click', '[data-tab]', (e, el) => { tab = el.dataset.tab; drawTabs(); drawPane(); });
    on(pane, 'click', 'tr[data-tc]', (e, el) => QA.router.go(`/testcases?id=${el.dataset.tc}`));
    on(pane, 'click', 'tr[data-prop]', (e, el) => QA.router.go(`/stories/${s.key}?proposal=${el.dataset.prop}`));
    on(view, 'click', '[data-act=gen]', (e, el) => generate(s.key, el));
    on(view, 'click', '[data-act=run]', () => C.runDialog({ preset: { storyKey: [s.key], label: `${s.key} story tests` }, title: `Run tests for ${s.key}` }));
    on(view, 'click', '[data-act=impact]', () => QA.router.go(`/regression?story=${s.key}`));
    return null;
  }

  // ── Proposal review ──
  async function renderProposal(view, proposalId, storyKey) {
    const p = QA.state.project;
    QA.router.setCrumbs([{ label: 'Jira stories', href: '/stories' }, ...(storyKey ? [{ label: storyKey, href: `/stories/${storyKey}` }] : []), { label: `Review ${proposalId}` }]);
    view.innerHTML = String(loading(10));
    let pr;
    try { pr = await api.get(`/api/proposals/${encodeURIComponent(proposalId)}`); } catch (e) { view.innerHTML = String(errorBox(e)); return null; }
    const a = pr.analysis || {};
    const editable = pr.status === 'proposed';
    const sel = pr.scenarios.map((s) => new Set(s.testCases.map((t, i) => (t.status === 'draft' ? null : i)).filter((i) => i !== null)));
    const total = () => sel.reduce((n, x) => n + x.size, 0);
    const allTests = pr.scenarios.reduce((n, s) => n + s.testCases.length, 0);
    const byType = pr.scenarios.reduce((m, s) => { m[s.type] = (m[s.type] || 0) + s.testCases.length; return m; }, {});

    view.innerHTML = String(h`${C.pageHead(h`Review generated tests for <span class="mono">${pr.storyKey}</span>`, h`${a.summary || ''} · Proposal ${pr.id} · ${badge(pr.status)} · generated by ${pr.createdBy} ${fmt.ago(pr.createdAt)}${a.generationMs ? ` in ${fmt.ms(a.generationMs)}` : ''}`)}
      <div class="step-flow" aria-label="Workflow"><span class="st done">${ic('check')} Analyse story</span><span class="ln"></span><span class="st done">${ic('check')} Generate scenarios</span><span class="ln"></span><span class="st ${editable ? 'now' : 'done'}">${editable ? '' : ic('check')} Review and approve</span><span class="ln"></span><span class="st ${editable ? '' : 'done'}">Save test cases</span><span class="ln"></span><span class="st">Optional Jira comment</span></div>
      ${a.metadataLabel === 'ASSUMED' ? h`<div class="callout warn mt">${ic('alert')}<div><b>Metadata is ASSUMED.</b> <span class="small">Objects and fields come from ${a.metadataSource || 'heuristics'}, not a live describe of the org. Confirm against the real org before treating results as VERIFIED.</span></div></div>` : a.metadataLabel === 'VERIFIED' ? h`<div class="callout ok mt">${ic('check')}<div class="small"><b>Metadata VERIFIED</b> against ${a.metadataSource}.</div></div>` : ''}
      <div class="grid g-12 mt">
        <div class="stack">
          <div class="card"><div class="card-head"><h2>Story analysis</h2>${prov(a.metadataLabel)}</div><div class="card-body">
            ${C.kv([['Objects', (a.objects || []).length ? h`${a.objects.map((o) => h`<span class="tag mono">${o}</span>`)}` : 'None detected'], ['Operations', (a.operations || []).join(', ') || '–'], ['API types', (a.apiTypes || []).join(', ') || '–'], ['Integration', a.integration ? 'Yes' : 'No'], ['Fields', Object.entries(a.fields || {}).map(([o, f]) => `${o}: ${f.join(', ')}`).join(' · ') || '–']])}
          </div></div>
          ${(a.acceptanceCriteria || []).length ? h`<div class="card"><div class="card-head"><h2>Acceptance criteria</h2></div><div class="card-body"><ol class="small" style="padding-left:18px;margin:0">${a.acceptanceCriteria.map((x) => h`<li style="margin-bottom:4px">${x}</li>`)}</ol></div></div>` : ''}
          ${(a.gaps || []).length || (a.notes || []).length ? h`<div class="card"><div class="card-head"><h2>Gaps and recommendations</h2></div><div class="card-body stack" style="gap:10px">${[...(a.gaps || []), ...(a.notes || []).map((n) => (typeof n === 'string' ? { label: 'ASSUMED', text: n } : n))].map((g) => h`<div class="row" style="align-items:flex-start;gap:8px">${prov(g.label || 'RECOMMENDED')}<span class="small">${g.text}</span></div>`)}</div></div>` : ''}
          <div class="card"><div class="card-head"><h2>Coverage by type</h2></div><div class="card-body">${raw(QA.charts.hbars({ items: Object.entries(byType).map(([k, v]) => ({ label: k, value: v })) }))}</div></div>
        </div>
        <div class="card"><div class="card-head"><h2>Proposed scenarios <span class="sub">${pr.scenarios.length} scenarios · ${allTests} test cases</span></h2>${editable ? h`<div class="row"><button class="btn xs" data-all="1">Select all</button><button class="btn xs" data-all="0">Select none</button></div>` : ''}</div>
          <div class="tree" data-tree>${pr.scenarios.map((s, si) => h`<details ${si < 3 ? 'open' : ''}><summary><span class="row" style="gap:8px;flex:1;min-width:0">${editable ? h`<input type="checkbox" data-sc="${si}" aria-label="Select scenario" ${sel[si].size === s.testCases.length ? 'checked' : ''}>` : ''}<b class="truncate">${s.title}</b><span class="spacer"></span><span class="tag">${s.type}</span>${pri(s.priority)}${prov(s.label)}<span class="small muted num">${s.testCases.length}</span></span></summary>
            ${s.description ? h`<p class="small muted" style="margin:4px 0 8px 26px">${s.description}</p>` : ''}
            ${s.testCases.map((t, ti) => h`<div class="leaf" style="display:flex;gap:10px;align-items:flex-start">
              ${editable ? h`<input type="checkbox" data-t="${si}:${ti}" ${sel[si].has(ti) ? 'checked' : ''} aria-label="Select test" style="margin-top:3px">` : ''}
              <div style="flex:1;min-width:0"><div class="row wrap" style="gap:6px"><span>${t.title}</span>${t.status === 'draft' ? badge('draft') : ''}</div>
                <div class="row wrap small" style="gap:6px;margin-top:3px">${method(t.method)}<code class="mono small truncate" style="max-width:420px">${fmt.shortPath(t.endpoint)}</code>${pri(t.priority)}${prov(t.label)}${t.auth && t.auth !== 'default' ? h`<span class="tag">auth: ${t.auth}</span>` : ''}${t.sfValidation ? h`<span class="tag">${ic('database')} SF validation</span>` : ''}<button class="btn xs ghost" data-detail="${si}:${ti}">Details</button></div></div></div>`)}
          </details>`)}</div>
        </div>
      </div>
      ${editable ? h`<div class="card mt" style="position:sticky;bottom:12px;box-shadow:var(--shadow-pop)"><div class="card-body row wrap" style="gap:14px">
        <span><b data-count>${total()}</b> of ${allTests} test cases selected</span>
        <label class="check-row"><input type="checkbox" name="postToJira"> Post a coverage comment and label to ${pr.storyKey} in Jira</label>
        <span class="spacer"></span><button class="btn danger-outline" data-act="reject">Reject proposal</button><button class="btn primary" data-act="approve">${ic('check')} Approve selected</button></div></div>` : h`<div class="callout info mt">${ic('info')}<div class="small">This proposal was ${pr.status}${pr.decision && pr.decision.by ? ` by ${pr.decision.by}` : ''} ${fmt.ago(pr.decidedAt)}. Generate again from the story to create a new proposal.</div></div>`}`);

    const sync = () => {
      view.querySelectorAll('[data-t]').forEach((cb) => { const [si, ti] = cb.dataset.t.split(':').map(Number); cb.checked = sel[si].has(ti); });
      view.querySelectorAll('[data-sc]').forEach((cb) => { const si = Number(cb.dataset.sc); cb.checked = sel[si].size === pr.scenarios[si].testCases.length; cb.indeterminate = sel[si].size > 0 && !cb.checked; });
      const c = view.querySelector('[data-count]'); if (c) c.textContent = total();
    };
    sync();
    on(view, 'click', 'summary input', (e) => e.stopPropagation());
    on(view, 'change', '[data-t]', (e, el) => { const [si, ti] = el.dataset.t.split(':').map(Number); el.checked ? sel[si].add(ti) : sel[si].delete(ti); sync(); });
    on(view, 'change', '[data-sc]', (e, el) => { const si = Number(el.dataset.sc); sel[si] = el.checked ? new Set(pr.scenarios[si].testCases.map((_, i) => i)) : new Set(); sync(); });
    on(view, 'click', '[data-all]', (e, el) => { pr.scenarios.forEach((s, si) => { sel[si] = el.dataset.all === '1' ? new Set(s.testCases.map((_, i) => i)) : new Set(); }); sync(); });
    on(view, 'click', '[data-detail]', (e, el) => { const [si, ti] = el.dataset.detail.split(':').map(Number); testDetail(pr.scenarios[si].testCases[ti]); });
    on(view, 'click', '[data-act=reject]', async (e, el) => {
      const ok = await QA.ui.confirm({ title: 'Reject this proposal?', message: 'No test cases are saved and nothing is sent to Jira.', confirmLabel: 'Reject', danger: true });
      if (!ok) return;
      try { await api.post(`/api/proposals/${pr.id}/reject`, {}); toast('Proposal rejected.', 'warn'); QA.router.go(`/stories/${pr.storyKey}`); } catch (err) { toastError(err); }
    });
    on(view, 'click', '[data-act=approve]', (e, el) => withBusy(el, async () => {
      if (!total()) { toast('Select at least one test case to approve.', 'warn'); return; }
      const postToJira = view.querySelector('[name=postToJira]').checked;
      if (postToJira) {
        const ok = await QA.ui.confirm({ title: `Update ${pr.storyKey} in Jira?`, message: h`A comment summarising ${total()} approved test cases and the label <code>api-tests-generated</code> will be added to ${pr.storyKey}.`, confirmLabel: 'Approve and update Jira' });
        if (!ok) return;
      }
      const selected = Object.fromEntries(sel.map((s, i) => [i, [...s].sort((x, y) => x - y)]));
      try {
        const r = await api.post(`/api/proposals/${pr.id}/approve`, { selected, postToJira });
        toast(h`${r.tests} test cases in ${r.scenarios} scenarios saved.${r.jira ? (r.jira.ok ? ` Jira ${pr.storyKey} updated.` : ` Jira was not updated: ${r.jira.title}`) : ''}`, r.jira && !r.jira.ok ? 'warn' : 'ok', 'Proposal approved');
        QA.router.go(`/stories/${pr.storyKey}`);
      } catch (err) { toastError(err, 'Approval failed'); }
    }));
    return null;
  }

  function testDetail(t) {
    const f = t.priorityReason && t.priorityReason.factors;
    modal({
      title: t.title, subtitle: `${t.testType} · ${t.priority} · ${t.label}`, size: 'xl',
      body: h`<div class="grid g-2"><div><h3>Request</h3><div class="row" style="gap:8px;margin:8px 0">${method(t.method)}<code class="mono small" style="word-break:break-all">${t.endpoint}</code></div>
        ${t.auth && t.auth !== 'default' ? h`<p class="small"><span class="tag">auth: ${t.auth}</span></p>` : ''}
        ${t.body !== undefined && t.body !== null ? json(t.body) : t.bodyRaw ? h`<pre class="code">${t.bodyRaw}</pre>` : h`<p class="small muted">No body.</p>`}
        ${(t.extract || []).length ? h`<h3 class="mt">Extract variables</h3><ul class="list small">${t.extract.map((x) => h`<li><code class="mono">{{${x.var}}}</code> ← <code class="mono">${x.path}</code></li>`)}</ul>` : ''}
        ${t.sfValidation ? h`<h3 class="mt">Salesforce validation</h3>${json(t.sfValidation)}` : ''}</div>
        <div><h3>Assertions</h3><ul class="list small" style="margin-top:8px">${(t.assertions || []).map((x) => h`<li><code class="mono">${x.type}${x.path ? ` ${x.path}` : ''}${x.name ? ` ${x.name}` : ''} ${x.op || ''} ${x.expected === undefined ? '' : JSON.stringify(x.expected)}</code>${x.label ? h`<div class="muted">${x.label}</div>` : ''}</li>`)}</ul>
        ${f ? h`<h3 class="mt">Priority factors <span class="small muted">(score ${t.priorityReason.score})</span></h3>${raw(QA.charts.hbars({ items: Object.entries(f).map(([k, v]) => ({ label: k.replace(/([A-Z])/g, ' $1').toLowerCase(), value: v, max: 3, display: `${v} × ${t.priorityReason.weights[k]}` })) }))}` : ''}
        ${t.description ? h`<h3 class="mt">Notes</h3><p class="small">${t.description}</p>` : ''}</div></div>`,
      foot: h`<button class="btn" data-close>Close</button>`,
    });
  }

  QA.pages.stories.generate = generate;
})();
</script>
  <script>/* Test scenarios: grouped coverage per story, with inline priority/status edits. */
(() => {
  const QA = window.QA;
  const { h, ic, badge, prov, pri, on, empty, toast, toastError, esc, confirm } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.scenarios = {
    render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Test scenarios' }]);
      const m = QA.state.meta;
      view.innerHTML = String(h`${C.pageHead('Test scenarios', 'Scenarios group test cases by intent — functional, negative, boundary, security and integration — and trace back to their Jira story.',
        h`<a class="btn primary" href="/stories" data-link>${ic('wand')} Generate from a story</a>`)}<div data-list></div>`);
      const list = C.listController(view.querySelector('[data-list]'), {
        sort: 's.id', dir: 'ASC', searchPlaceholder: 'Search id, title, story or object',
        filters: { type: ctx.query.type || '', priority: ctx.query.priority || '', storyKey: ctx.query.storyKey || '' },
        toolbar: (s) => h`${C.chipGroup('type', m.testTypes.filter((t) => ['Functional', 'Negative', 'Boundary', 'Security', 'Integration'].includes(t)), (s.filters.type || '').split(','))}
          <select class="select" data-filter="priority" aria-label="Priority"><option value="">All priorities</option>${m.priorities.map((x) => h`<option ${s.filters.priority === x ? 'selected' : ''}>${x}</option>`)}</select>`,
        fetch: (q) => api.get(`/api/scenarios${api.qs({ projectId: p.id, ...q })}`),
        rowAttrs: (r) => `data-id="${esc(r.id)}"`,
        onRow: (r) => QA.router.go(`/testcases?scenarioId=${r.id}`),
        emptyState: () => empty({ icon: 'layers', title: 'No scenarios', text: 'Approve a generated proposal to create scenarios.' }),
        columns: [
          { key: 'id', label: 'Id', sortable: true, sortKey: 's.id', render: (r) => h`<span class="mono small">${r.id}</span>` },
          { key: 'title', label: 'Scenario', sortable: true, sortKey: 's.title', render: (r) => h`<div class="cell-title">${r.title}</div><div class="cell-sub">${r.description || ''}</div>` },
          { key: 'storyKey', label: 'Story', sortable: true, sortKey: 's.storyKey', render: (r) => (r.storyKey ? h`<a href="/stories/${r.storyKey}" data-link class="small">${r.storyKey}</a>` : '–') },
          { key: 'type', label: 'Type', sortable: true, sortKey: 's.type' },
          { key: 'apiType', label: 'API', sortable: true, sortKey: 's.apiType', render: (r) => h`<span class="small">${r.apiType || '–'}</span>` },
          { key: 'priority', label: 'Priority', sortable: true, sortKey: 's.priority', render: (r) => h`<select class="select" data-pri="${r.id}" aria-label="Priority for ${r.id}" style="height:26px;width:64px">${m.priorities.map((x) => h`<option ${r.priority === x ? 'selected' : ''}>${x}</option>`)}</select>` },
          { key: 'label', label: 'Provenance', render: (r) => prov(r.label) },
          { key: 'tests', label: 'Tests', render: (r) => h`<span class="num">${r.tests}</span><div class="cell-sub">${r.passed} passed${r.failed ? h` · <span class="text-error">${r.failed} failed</span>` : ''}</div>` },
          { key: 'status', label: 'Status', sortable: true, sortKey: 's.status', render: (r) => badge(r.status) },
          { key: 'actions', label: '', cls: 'actions', render: (r) => h`<button class="btn xs ghost" data-del="${r.id}" aria-label="Delete ${r.id}">${ic('trash')}</button>` },
        ],
      });
      on(view, 'change', '[data-pri]', async (e, el) => {
        try { await api.put(`/api/scenarios/${el.dataset.pri}`, { priority: el.value }); toast(`${el.dataset.pri} set to ${el.value}.`, 'ok'); } catch (err) { toastError(err); list.reload(); }
      });
      on(view, 'click', '[data-del]', async (e, el) => {
        const ok = await confirm({ title: `Delete scenario ${el.dataset.del}?`, message: 'Its test cases are deleted too. Execution history is kept.', confirmLabel: 'Delete scenario', danger: true });
        if (!ok) return;
        try { const r = await api.del(`/api/scenarios/${el.dataset.del}`); toast(`Scenario deleted${r && r.testCases ? ` with ${r.testCases} test cases` : ''}.`, 'warn'); list.reload(); } catch (err) { toastError(err); }
      });
      return null;
    },
  };
})();
</script>
  <script>/* Test cases: filterable list, bulk actions, editor drawer, history and automation preview. */
(() => {
  const QA = window.QA;
  const { h, raw, ic, fmt, badge, prov, pri, method, on, errorBox, loading, empty, toast, toastError, withBusy, esc, json, drawer, confirm } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.testcases = {
    render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Test cases' }]);
      const m = QA.state.meta;
      view.innerHTML = String(h`${C.pageHead('Test cases', `Executable API test cases for ${p.name}. Every case carries a priority and a provenance label.`,
        h`<button class="btn" data-act="new">${ic('plus')} New test case</button><button class="btn primary" data-act="run">${ic('play')} Run tests</button>`)}
        <div class="card" style="margin-bottom:12px" data-bulk hidden><div class="card-body row wrap" style="gap:10px;padding:10px 14px">
          <b data-selcount></b><span class="spacer"></span>
          <button class="btn sm primary" data-bulk-act="run">${ic('play')} Run selected</button>
          <select class="select" data-bulk-act="priority" aria-label="Set priority" style="height:28px"><option value="">Set priority…</option>${m.priorities.map((x) => h`<option>${x}</option>`)}</select>
          <select class="select" data-bulk-act="status" aria-label="Set status" style="height:28px"><option value="">Set status…</option>${['ready', 'draft', 'disabled'].map((x) => h`<option>${x}</option>`)}</select>
          <button class="btn sm danger-outline" data-bulk-act="delete">${ic('trash')} Delete</button></div></div>
        <div data-list></div>`);

      const f = ctx.query;
      const list = C.listController(view.querySelector('[data-list]'), {
        sort: 'seq', dir: 'ASC', selectable: true, q: f.q || '', searchPlaceholder: 'Search id, title, endpoint or story',
        filters: { tag: f.tag || '', priority: f.priority || '', testType: f.testType || '', lastResult: f.lastResult || '', apiType: f.apiType || '', status: f.status || '', label: f.label || '', storyKey: f.storyKey || '', scenarioId: f.scenarioId || '' },
        toolbar: (s) => h`${C.chipGroup('priority', m.priorities, (s.filters.priority || '').split(','))}
          <select class="select" data-filter="testType" aria-label="Test type"><option value="">All types</option>${m.testTypes.map((x) => h`<option ${s.filters.testType === x ? 'selected' : ''}>${x}</option>`)}</select>

        columns: [
          { key: 'id', label: 'Id', sortable: true, render: (r) => h`<span class="mono small">${r.id}</span>` },

          { key: 'storyKey', label: 'Story', sortable: true, render: (r) => (r.storyKey ? h`<a href="/stories/${r.storyKey}" data-link class="small">${r.storyKey}</a>` : '–') },
          { key: 'testType', label: 'Type', sortable: true, render: (r) => h`<span class="small">${r.testType}</span>` },
          { key: 'priority', label: 'Pri', sortable: true, render: (r) => pri(r.priority) },
          { key: 'label', label: 'Provenance', render: (r) => prov(r.label) },
          { key: 'status', label: 'Status', sortable: true, render: (r) => badge(r.status) },
          { key: 'lastResult', label: 'Last result', sortable: true, render: (r) => (r.lastResult ? h`${badge(r.lastResult)}<div class="cell-sub">${fmt.ago(r.lastRunAt)} · ${fmt.ms(r.lastResponseMs)}</div>` : h`<span class="faint small">Not run</span>`) },
        ],
      });

      on(view, 'click', '[data-act=run]', () => C.runDialog());
      on(view, 'click', '[data-act=new]', () => openEditor(null, list));
      on(view, 'click', '[data-bulk-act=run]', (e, el) => C.startRun({ testCaseIds: [...list.state.selected], label: `${list.state.selected.size} selected tests` }, el));
      on(view, 'change', 'select[data-bulk-act]', async (e, el) => {
        const field = el.dataset.bulkAct; const value = el.value; el.value = '';
        if (!value) return;
        try { const r = await api.post(`/api/testcases/bulk?projectId=${p.id}`, { ids: [...list.state.selected], [field]: value }); toast(`${r.updated} test cases updated.`, 'ok'); list.reload(); } catch (err) { toastError(err); }
      });
      on(view, 'click', '[data-bulk-act=delete]', async () => {
        const n = list.state.selected.size;
        const ok = await confirm({ title: `Delete ${n} test cases?`, message: 'Execution history is kept, but the test cases are removed from future runs.', confirmLabel: 'Delete', danger: true });
        if (!ok) return;
        try { await api.post(`/api/testcases/bulk?projectId=${p.id}`, { ids: [...list.state.selected], delete: true }); list.state.selected.clear(); view.querySelector('[data-bulk]').hidden = true; toast(`${n} test cases deleted.`, 'warn'); list.reload(); } catch (err) { toastError(err); }
      });
      if (f.id) openEditor(f.id, list);
      return null;
    },
  };

  const J = (v) => (v === undefined || v === null ? '' : JSON.stringify(v, null, 2));
  function parseJson(text, label, fallback) {
    if (!String(text).trim()) return fallback;
    try { return JSON.parse(text); } catch (e) { throw Object.assign(new Error(`${label} is not valid JSON: ${e.message}`), { info: { action: `Fix the JSON in the ${label} field.` } }); }

  async function openEditor(id, list) {

          <label class="field"><span>Priority</span><select class="select" name="priority">${!id ? h`<option value="">Calculate automatically</option>` : ''}${m.priorities.map((x) => h`<option ${t.priority === x ? 'selected' : ''}>${x}</option>`)}</select></label>
          <label class="field"><span>Status</span><select class="select" name="status">${['ready', 'draft', 'disabled'].map((x) => h`<option ${t.status === x ? 'selected' : ''}>${x}</option>`)}</select></label>
          <label class="field"><span>Provenance</span><select class="select" name="label">${['ASSUMED', 'RECOMMENDED', 'VERIFIED'].map((x) => h`<option ${t.label === x ? 'selected' : ''}>${x}</option>`)}</select><small>VERIFIED requires confirming metadata against a live org.</small></label>
          <label class="field"><span>Story key</span><input class="input mono" name="storyKey" value="${t.storyKey || ''}"></label>
          <label class="field"><span>Salesforce object</span><input class="input mono" name="object" value="${t.object || ''}"></label>
          <label class="field full"><span>Tags (comma separated)</span><input class="input" name="tags" value="${(t.tags || []).join(', ')}"></label>
          <label class="field full"><span>Description</span><textarea class="input" rows="3" name="description">${t.description || ''}</textarea></label>
        </div>
        ${pr && pr.factors ? h`<div class="card mt"><div class="card-head"><h2>Why ${pr.priority}?</h2><span class="small muted">score ${pr.score} of 100</span></div><div class="card-body">${raw(QA.charts.hbars({ items: Object.entries(pr.factors).map(([k, v]) => ({ label: k.replace(/([A-Z])/g, ' $1').toLowerCase(), value: v, max: 3, display: `${v}/3 × weight ${pr.weights[k]}` })) }))}</div></div>` : ''}
        ${t.defects && t.defects.length ? h`<div class="callout error mt">${ic('bug')}<div class="small">Linked defects: ${t.defects.map((x) => h`<a href="${x.url}" target="_blank" rel="noopener">${x.key}</a> (${x.status}) `)}</div></div>` : ''}

      <div data-p="request" class="hidden"><div class="form-grid">
        <label class="field"><span>Method</span><select class="select" name="method">${['GET', 'POST', 'PATCH', 'PUT', 'DELETE', 'HEAD'].map((x) => h`<option ${t.method === x ? 'selected' : ''}>${x}</option>`)}</select></label>
        <label class="field"><span>API type</span><select class="select" name="apiType">${m.apiTypes.map((x) => h`<option ${t.apiType === x ? 'selected' : ''}>${x}</option>`)}</select></label>
        <label class="field full"><span>Endpoint</span><input class="input mono" name="endpoint" value="${t.endpoint || ''}" required><small>Use variables such as <code>{{apiVersion}}</code>, <code>{{accountId}}</code>, <code>{{$uuid}}</code>. Never paste tokens.</small></label>
        <label class="field"><span>Authentication</span><select class="select" name="auth">${[['default', 'Project integration user'], ['lowpriv', 'Low-privilege user'], ['none', 'No token (negative)'], ['invalid', 'Invalid token (negative)']].map(([v, l]) => h`<option value="${v}" ${t.auth === v ? 'selected' : ''}>${l}</option>`)}</select></label>

        <label class="field full"><span>Extract variables (JSON)</span><textarea class="input mono" rows="3" name="extract" spellcheck="false">${J(t.extract || [])}</textarea><small>e.g. <code>[{"var":"accountId","path":"$.id"}]</code></small></label>
