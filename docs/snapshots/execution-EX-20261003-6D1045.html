        <label class="field mt"><span>Cleanup (JSON)</span><textarea class="input mono" rows="3" name="cleanup" spellcheck="false">${J(t.cleanup)}</textarea><small>Records created by this test are deleted after the run (never in Production).</small></label></div>
      </form>
      <div data-p="history" class="hidden">${id ? QA.ui.table({ rows: t.history, rowAttrs: (r) => `data-res="${esc(r.id)}"`, emptyState: empty({ icon: 'clock', title: 'Never executed' }), columns: [
        { key: 'startedAt', label: 'When', render: (r) => fmt.date(r.startedAt) }, { key: 'runId', label: 'Execution', render: (r) => h`<a href="/execution/${r.runId}" data-link class="mono small">${r.runId}</a>` },
        { key: 'status', label: 'Result', render: (r) => badge(r.status) }, { key: 'statusCode', label: 'HTTP', render: (r) => C.statusCode(r.statusCode) }, { key: 'responseMs', label: 'Time', cls: 'num', render: (r) => fmt.ms(r.responseMs) }, { key: 'defectKey', label: 'Defect' },
      ] }) : ''}</div>
      <div data-p="automation" class="hidden" data-auto><p class="small muted">Generates a Postman item for this test with pre-request OAuth from environment variables (no hardcoded secrets) and a Newman command.</p><button class="btn" data-act="automate">${ic('code')} Generate automation</button></div>`);
    d.setFoot(h`${id ? h`<button class="btn danger-outline" data-act="delete">${ic('trash')} Delete</button><button class="btn" data-act="dup">${ic('copy')} Duplicate</button>` : ''}<span class="spacer"></span>${id ? h`<button class="btn" data-act="runone">${ic('play')} Run</button>` : ''}<button class="btn primary" data-act="save" ${readonly ? 'disabled' : ''}>${id ? 'Save changes' : 'Create test case'}</button>`);

    const showTab = (x) => { tab = x; d.el.querySelector('[data-ttabs]').innerHTML = String(C.tabs(TABS, tab)); d.el.querySelectorAll('[data-p]').forEach((pn) => pn.classList.toggle('hidden', pn.dataset.p !== tab)); };
    on(d.el, 'click', '[data-tab]', (e, el) => showTab(el.dataset.tab));
    on(d.el, 'click', 'tr[data-res]', (e, el) => { if (!e.target.closest('a')) C.openResult(el.dataset.res); });
    const form = d.el.querySelector('[data-form]');
    const collect = () => {
      const v = (n) => (form.elements[n] ? form.elements[n].value : undefined);
      const b = {
        title: v('title').trim(), testType: v('testType'), status: v('status'), label: v('label'), storyKey: v('storyKey').trim() || null, object: v('object').trim() || null,
        tags: v('tags').split(',').map((x) => x.trim()).filter(Boolean), description: v('description') || null,
        method: v('method'), apiType: v('apiType'), endpoint: v('endpoint').trim(), auth: v('auth'), timeoutMs: v('timeoutMs') ? Number(v('timeoutMs')) : null,
        headers: parseJson(v('headers'), 'Headers', {}), query: parseJson(v('query'), 'Query parameters', {}), body: parseJson(v('body'), 'Body', null),
        extract: parseJson(v('extract'), 'Extract variables', []), assertions: parseJson(v('assertions'), 'Assertions', []),
        sfValidation: parseJson(v('sfValidation'), 'Salesforce validation', null), cleanup: parseJson(v('cleanup'), 'Cleanup', null),
      };
      if (form.elements.bodyRaw) b.bodyRaw = v('bodyRaw');
      if (v('priority')) b.priority = v('priority');
      if (!b.title) throw Object.assign(new Error('Title is required.'), { info: {} });
      return b;
    };
    on(d.el, 'click', '[data-act=save]', (e, el) => withBusy(el, async () => {
      let b;
      try { b = collect(); } catch (err) { toastError(err, 'Cannot save'); return; }
      try {
        if (b.label === 'VERIFIED' && t.label !== 'VERIFIED') {
          const ok = await confirm({ title: 'Mark as VERIFIED?', message: 'Only mark a test VERIFIED after its objects, fields and endpoint have been confirmed against a live Salesforce org (not demo or assumed metadata).', confirmLabel: 'I confirmed it against a live org' });
          if (!ok) return;
          b.confirmVerified = true;
        }
        const saved = id ? await api.put(`/api/testcases/${id}`, b) : await api.post(`/api/testcases?projectId=${p.id}`, b);
        toast(`${saved.id} ${id ? 'saved' : 'created'}.`, 'ok');
        d.close(); list.reload();
      } catch (err) { toastError(err, 'Not saved'); }
    }));
    on(d.el, 'click', '[data-act=dup]', (e, el) => withBusy(el, async () => { try { const c = await api.post(`/api/testcases/${id}/duplicate`); toast(`Duplicated as ${c.id}.`, 'ok'); d.close(); list.reload(); openEditor(c.id, list); } catch (err) { toastError(err); } }));
    on(d.el, 'click', '[data-act=delete]', async () => {
      const ok = await confirm({ title: `Delete ${id}?`, message: 'Execution history is kept for traceability.', confirmLabel: 'Delete', danger: true });
      if (!ok) return;
      try { await api.del(`/api/testcases/${id}`); toast(`${id} deleted.`, 'warn'); d.close(); list.reload(); } catch (err) { toastError(err); }
    });
    on(d.el, 'click', '[data-act=runone]', (e, el) => C.startRun({ testCaseIds: [id], label: `Single test ${id}` }, el));
    on(d.el, 'click', '[data-act=automate]', (e, el) => withBusy(el, async () => {
      try {
        const r = await api.post(`/api/testcases/${id}/automate`);
        d.el.querySelector('[data-auto]').innerHTML = String(h`<h3>Newman</h3><pre class="code">${r.newman}</pre><h3 class="mt">Node runner</h3><pre class="code">${r.node}</pre><h3 class="mt">Postman collection item</h3>${json(r.collection)}`);
      } catch (err) { toastError(err); }
    }));
  }
})();
</script>
  <script>/* Test execution: run history, live run view (ribbon + stream), results, analysis. */
(() => {
  const QA = window.QA;
  const { h, raw, ic, fmt, badge, pri, method, on, errorBox, loading, empty, toast, toastError, withBusy, esc } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.execution = {
    render(view, ctx) {
      if (!QA.state.project) { view.innerHTML = String(C.projectRequired()); return null; }
      return ctx.params.runId ? renderRun(view, ctx) : renderList(view, ctx);
    },
  };

  // ── Run history ──
  function renderList(view, ctx) {
    const p = QA.state.project;
    QA.router.setCrumbs([{ label: 'Test execution' }]);
    view.innerHTML = String(h`${C.pageHead('Test execution', `Run history for ${p.name}. Runs execute in the background; open one to watch it live.`,
      h`<button class="btn" data-act="failed">${ic('refresh')} Re-run failed</button><button class="btn primary" data-act="run">${ic('play')} Run tests</button>`)}
      ${C.connectionNotice(p)}<div data-list></div>`);
    const list = C.listController(view.querySelector('[data-list]'), {
      sort: 'startedAt', dir: 'DESC', searchPlaceholder: 'Search by execution id, label or user',
      filters: { status: ctx.query.status || '' },
      toolbar: (s) => C.chipGroup('status', ['running', 'completed', 'stopped', 'error'].map((v) => ({ value: v, label: v[0].toUpperCase() + v.slice(1) })), (s.filters.status || '').split(',')),
      fetch: (q) => api.get(`/api/runs${api.qs({ projectId: p.id, ...q })}`),
      rowAttrs: (r) => `data-id="${esc(r.id)}"`,
      onRow: (r) => QA.router.go(`/execution/${r.id}`),
      emptyState: () => empty({ icon: 'play', title: 'No executions yet', text: 'Start a run to execute the approved test cases against the selected environment.', action: h`<button class="btn primary" data-act="run">${ic('play')} Run tests</button>` }),
      columns: [
        { key: 'id', label: 'Execution', sortable: false, render: (r) => h`<span class="mono small">${r.id}</span><div class="cell-sub">${r.label || r.trigger || 'manual'}</div>` },
        { key: 'status', label: 'Status', sortable: true, render: (r) => badge(r.status) },
        { key: 'environment', label: 'Env' },
        { key: 'total', label: 'Tests', sortable: true, cls: 'num' },
        { key: 'result', label: 'Result', render: (r) => h`<div class="progress" style="width:120px"><span style="width:${(r.passed / Math.max(1, r.total)) * 100}%;background:var(--success)"></span><span style="width:${(r.failed / Math.max(1, r.total)) * 100}%;background:var(--error)"></span><span style="width:${(r.blocked / Math.max(1, r.total)) * 100}%;background:var(--warning)"></span></div><div class="cell-sub num">${r.passed} passed · ${r.failed} failed${r.blocked ? ` · ${r.blocked} blocked` : ''}</div>` },
        { key: 'failed', label: 'Failed', sortable: true, cls: 'num', render: (r) => (r.failed ? h`<span class="text-error">${r.failed}</span>` : '0') },
        { key: 'avgResponseMs', label: 'Avg', cls: 'num', render: (r) => fmt.ms(r.avgResponseMs) },
        { key: 'user', label: 'By' },
        { key: 'startedAt', label: 'Started', sortable: true, render: (r) => h`<span title="${fmt.date(r.startedAt)}">${fmt.ago(r.startedAt)}</span><div class="cell-sub">${fmt.duration(r.startedAt, r.endedAt)}</div>` },
      ],
    });
    on(view, 'click', '[data-act=run]', () => C.runDialog());
    on(view, 'click', '[data-act=failed]', (e, el) => C.startRun({ mode: 'failed' }, el));
    const t = setInterval(() => { if ((list.state.data && (list.state.data.items || []).some((r) => r.status === 'running'))) list.reload(); }, 4000);
    return () => clearInterval(t);
  }

  // ── Single run ──
  async function renderRun(view, ctx) {

    view.innerHTML = String(loading(12));

    try {
      [run, results] = await Promise.all([api.get(`/api/runs/${encodeURIComponent(runId)}`), loadAllResults(runId)]);
    } catch (e) { view.innerHTML = String(errorBox(e)); return null; }

    const state = { tab: ctx.query.tab || 'results', status: ctx.query.status || '', q: '', live: run.status === 'running', log: [] };
    const byIndex = results.slice();
    // Pre-size the ribbon for live runs so cells fill in place.
    const total = Math.max(run.total, byIndex.length);
    const cells = Array.from({ length: total }, (_, i) => byIndex[i] ? { ...byIndex[i] } : { status: 'pending', seq: i + 1, title: '' });

    view.innerHTML = String(h`<div data-head></div>
      <div class="card mt"><div class="card-head"><h2>Execution order <span class="sub" data-progress></span></h2><div class="ribbon-legend" style="margin:0"><span><i style="background:var(--success)"></i>Passed</span><span><i style="background:var(--error)"></i>Failed</span><span><i style="background:var(--warning)"></i>Blocked</span><span><i style="background:var(--skipped)"></i>Skipped</span><span><i style="background:var(--primary)"></i>Running</span></div></div>
        <div class="ribbon-wrap" data-ribbon></div></div>
      <div data-live></div>
      <div class="mt" data-tabs></div><div data-pane></div>`);

    const head = view.querySelector('[data-head]');
    const drawHead = () => {
      const exec = run.passed + run.failed;
      const s = run.summary || {};
      head.innerHTML = String(h`${C.pageHead(h`<span class="mono" style="font-size:20px">${run.id}</span>`, h`${run.label || 'Execution'} · ${run.environment} · ${run.trigger || 'manual'} by ${run.user} · started ${fmt.date(run.startedAt)}`,
        h`${badge(run.status)}
          ${state.live ? h`<button class="btn danger-outline" data-act="stop">${ic('stop')} Stop run</button>` : h`
          <button class="btn" data-act="rerun-failed" ${run.failed + run.blocked ? '' : 'disabled'}>${ic('refresh')} Re-run failed</button>
          <a class="btn" href="/reports?run=${run.id}" data-link>${ic('download')} Report</a>`}`)}
        <div class="kpis" style="--cols:7">
          ${kpiCell('Tests', fmt.num(run.total))}
          ${kpiCell('Passed', fmt.num(run.passed), 'ok')}
          ${kpiCell('Failed', fmt.num(run.failed), run.failed ? 'bad' : '')}
          ${kpiCell('Blocked', fmt.num(run.blocked), run.blocked ? 'warn' : '')}
          ${kpiCell('Pass rate', exec ? `${Math.round((run.passed / exec) * 1000) / 10}%` : '–')}
          ${kpiCell('Avg / p95', run.avgResponseMs ? h`${fmt.num(run.avgResponseMs)}<span class="unit">ms</span>` : '–', '', s.p95Ms ? `p95 ${fmt.ms(s.p95Ms)}` : '')}
          ${kpiCell('Duration', fmt.duration(run.startedAt, run.endedAt), '', run.sfErrors ? `${run.sfErrors} Salesforce errors` : `${run.apiErrors || 0} API errors`)}
        </div>`);
    };
    const kpiCell = (label, value, tone = '', foot = '') => h`<div class="kpi ${tone}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${foot ? h`<div class="kpi-foot">${foot}</div>` : ''}</div>`;

    const ribbonEl = view.querySelector('[data-ribbon]');
    const drawRibbon = () => {
      ribbonEl.innerHTML = QA.charts.ribbon(cells, { large: true });
      const done = cells.filter((c) => !['pending', 'running'].includes(c.status)).length;
      view.querySelector('[data-progress]').textContent = state.live ? `${done} of ${cells.length} complete` : `${cells.length} tests · click a cell for details`;
    };
    on(ribbonEl, 'click', '.cell[data-result]', (e, el) => C.openResult(el.dataset.result, { onChange: refreshAll }));

    const drawLive = () => {
      const el = view.querySelector('[data-live]');
      if (!state.live && !state.log.length) { el.innerHTML = ''; return; }
      el.innerHTML = String(h`<div class="card mt"><div class="card-head"><h2>Live activity ${state.live ? h`<span class="badge running" style="margin-left:8px">Streaming</span>` : ''}</h2><span class="small muted">Server-sent events · correlation ids recorded per request</span></div>
        <div class="card-body" style="max-height:220px;overflow-y:auto;font-family:var(--mono);font-size:12px" data-log>${state.log.slice(-200).map((l) => h`<div class="${l.cls || ''}"><span class="faint">${l.t}</span> ${l.text}</div>`)}</div></div>`);
      const lg = el.querySelector('[data-log]'); if (lg) lg.scrollTop = lg.scrollHeight;
    };

    const TABS = () => [
      { id: 'results', label: 'Results', n: cells.filter((c) => c.id).length },
      { id: 'analysis', label: 'Failure analysis', n: run.failed + run.blocked || null },
      { id: 'jira', label: 'Jira activity', n: (run.jiraActivity || []).length || null },
      { id: 'data', label: 'Test data & cleanup' },
    ];
    const drawTabs = () => { view.querySelector('[data-tabs]').innerHTML = String(C.tabs(TABS(), state.tab)); };
    on(view, 'click', '[data-tab]', (e, el) => { state.tab = el.dataset.tab; QA.router.setQuery({ tab: state.tab === 'results' ? '' : state.tab }); drawTabs(); drawPane(); });

    const pane = view.querySelector('[data-pane]');
    async function drawPane() {
      if (state.tab === 'results') return drawResults();
      if (state.tab === 'analysis') return drawAnalysis();
      if (state.tab === 'jira') return drawJira();
      return drawData();
    }

    function drawResults() {
      const rows = cells.filter((c) => c.id).filter((c) => !state.status || state.status.split(',').includes(c.status)).filter((c) => !state.q || `${c.title} ${c.endpoint} ${c.testCaseId}`.toLowerCase().includes(state.q.toLowerCase()));
      const counts = (s) => cells.filter((c) => c.status === s).length;
      pane.innerHTML = String(h`<div class="card"><div class="toolbar"><input class="input search" type="search" placeholder="Filter by title, endpoint or test id" value="${state.q}" data-rq aria-label="Filter results">
        ${C.chipGroup('rstatus', ['failed', 'blocked', 'passed', 'skipped'].map((s) => ({ value: s, label: `${s[0].toUpperCase() + s.slice(1)} (${counts(s)})` })), state.status.split(','))}
        <span class="spacer"></span><span class="small muted">${rows.length} shown</span></div>
        ${QA.ui.table({ rows: rows.slice(0, 500), rowAttrs: (r) => `data-rid="${esc(r.id)}"`, emptyState: empty({ title: 'No results match', text: state.live ? 'Results appear here as each test completes.' : 'Clear the filters to see every result.' }), columns: [
          { key: 'seq', label: '#', cls: 'num', width: '48px' },
          { key: 'status', label: 'Status', width: '96px', render: (r) => badge(r.status) },
          { key: 'title', label: 'Test', render: (r) => h`<div class="cell-title">${r.title}</div><div class="cell-sub">${C.endpoint(r.method, r.endpoint)}</div>${r.reason ? h`<div class="cell-sub" style="color:var(--error-text)">${r.reason}</div>` : ''}` },
          { key: 'priority', label: 'Pri', render: (r) => pri(r.priority) },
          { key: 'testType', label: 'Type', render: (r) => h`<span class="small">${r.testType}</span>` },
          { key: 'statusCode', label: 'HTTP', render: (r) => C.statusCode(r.statusCode) },
          { key: 'sfValidation', label: 'SF data', render: (r) => (r.sfValidation ? badge(r.sfValidation) : h`<span class="faint">–</span>`) },
          { key: 'responseMs', label: 'Time', cls: 'num', render: (r) => fmt.ms(r.responseMs) },
          { key: 'defectKey', label: 'Defect', render: (r) => (r.defectKey ? h`<a href="/defects?q=${r.defectKey}" data-link>${r.defectKey}</a>` : r.status === 'failed' ? h`<button class="btn xs" data-defect="${r.id}">${ic('bug')} Preview</button>` : '') },
        ] })}</div>`);
    }
    on(pane, 'input', '[data-rq]', QA.ui.debounce((e) => { state.q = e.target.value; const pos = e.target.selectionStart; drawResults(); const i = pane.querySelector('[data-rq]'); i.focus(); i.setSelectionRange(pos, pos); }, 250));
    on(pane, 'click', '[data-chip=rstatus]', (e, el) => { const s = new Set(state.status.split(',').filter(Boolean)); s.has(el.dataset.value) ? s.delete(el.dataset.value) : s.add(el.dataset.value); state.status = [...s].join(','); QA.router.setQuery({ status: state.status }); drawResults(); });
    on(pane, 'click', 'tr[data-rid]', (e, el) => { if (e.target.closest('button, a')) return; C.openResult(el.dataset.rid, { onChange: refreshAll }); });
    on(pane, 'click', '[data-defect]', (e, el) => C.defectPreview(el.dataset.defect, { onCreated: refreshAll }));

    async function drawAnalysis() {
      pane.innerHTML = String(loading(6));
      try {
        const a = await api.get(`/api/runs/${run.id}/analysis`);
        if (!a.failures.length) { pane.innerHTML = String(h`<div class="card">${empty({ icon: 'check', title: 'No failures to analyse', text: 'Every executed test passed in this run.' })}</div>`); return; }
        pane.innerHTML = String(h`
          ${a.aiSummary ? h`<div class="callout info">${ic('spark')}<div><b>AI summary</b> ${QA.ui.prov('ASSUMED')}<div class="small mt-s" style="white-space:pre-wrap">${a.aiSummary}</div></div></div>` : ''}
          <div class="grid g-21 ${a.aiSummary ? 'mt' : ''}">
            <div class="card"><div class="card-head"><h2>Failures and root causes</h2><span class="small muted">Defects are never created automatically — preview and confirm each one.</span></div>
              <div class="card-body flush">${a.failures.map((f) => h`<div style="padding:14px 18px;border-bottom:1px solid var(--border)">
                <div class="row wrap" style="gap:8px">${badge(f.status)}<b>${f.title}</b><span class="spacer"></span>${f.defectKey ? h`<a class="badge Open plain" href="/defects?q=${f.defectKey}" data-link>${f.defectKey}</a>` : f.status === 'failed' ? h`<button class="btn sm" data-defect="${f.resultId}">${ic('bug')} Preview Jira defect</button>` : ''}<button class="btn sm ghost" data-open="${f.resultId}">Details</button></div>
                ${f.analysis ? h`<div class="row wrap small mt-s" style="gap:8px"><span class="tag">${f.analysis.category}</span>${QA.ui.prov(f.analysis.label)}<span class="muted">confidence ${f.analysis.confidence}</span>${f.statusCode ? h`<span class="muted">HTTP ${f.statusCode}</span>` : ''}</div>
                <p class="small" style="margin:8px 0 4px">${f.analysis.rootCause}</p>
                ${f.analysis.evidence && f.analysis.evidence.length ? h`<ul class="list small muted" style="margin:0 0 6px">${f.analysis.evidence.slice(0, 4).map((x) => h`<li>${x}</li>`)}</ul>` : ''}
                <p class="small" style="margin:0"><b>Recommended action:</b> ${f.analysis.action}</p>` : ''}
              </div>`)}</div></div>
            <div class="stack">
              <div class="card"><div class="card-head"><h2>Failure categories</h2></div><div class="card-body">${QA.charts.hbars ? raw(QA.charts.hbars({ items: a.categories.map((c) => ({ label: c.category, value: c.count, color: '--error' })) })) : ''}</div></div>
              <div class="card"><div class="card-head"><h2>Endpoint hotspots</h2></div><div class="card-body flush"><ul class="list" style="margin:0">${a.hotspots.map((x) => h`<li style="padding:10px 18px"><code class="mono small" style="word-break:break-all">${x.endpoint}</code><div class="small muted">${x.failed} of ${x.total} failed</div></li>`)}</ul></div></div>
              <div class="card"><div class="card-head"><h2>Regression recommendation</h2>${QA.ui.prov('RECOMMENDED')}</div><div class="card-body">
                ${a.regressionRecommendation.tests.length ? h`<p class="small muted" style="margin-top:0">Re-run ${a.regressionRecommendation.tests.length} P0/P1 tests on objects with failures: ${a.regressionRecommendation.objects.join(', ')}.</p><button class="btn sm primary" data-regress>${ic('play')} Run recommended regression</button>` : h`<p class="small muted" style="margin:0">No P0/P1 tests share objects with the failures.</p>`}
              </div></div>
            </div>
          </div>`);
        state.regressIds = a.regressionRecommendation.tests.map((t) => t.id);
      } catch (e) { pane.innerHTML = String(errorBox(e)); }
    }
    on(pane, 'click', '[data-regress]', (e, el) => C.startRun({ testCaseIds: state.regressIds, label: `Regression after ${run.id}` }, el));
    on(pane, 'click', '[data-open]', (e, el) => C.openResult(el.dataset.open, { onChange: refreshAll }));

    function drawJira() {
      const act = run.jiraActivity || [];
      pane.innerHTML = String(h`<div class="card">${act.length ? h`<ul class="list" style="margin:0">${act.map((a) => h`<li style="padding:12px 18px"><div class="row"><b>${a.action}</b><span class="spacer"></span><span class="small muted">${fmt.date(a.ts)} · ${a.user}</span></div><div class="small muted mono">${JSON.stringify(a.detail)}</div></li>`)}</ul>` : empty({ icon: 'jira', title: 'No Jira activity for this run', text: 'Defects created from this run, story links and comments are listed here.' })}</div>`);
    }
    function drawData() {
      const s = run.summary || {};
      const cl = s.cleanup;
      const recs = run.createdRecords || [];
      const byObj = recs.reduce((m, r) => { m[r.object] = (m[r.object] || 0) + 1; return m; }, {});
      pane.innerHTML = String(h`<div class="grid g-2"><div class="card"><div class="card-head"><h2>Records created by this run</h2><span class="small muted">${recs.length} records</span></div><div class="card-body">
        ${recs.length ? QA.charts.hbars({ items: Object.entries(byObj).map(([o, n]) => ({ label: o, value: n })) }) : h`<p class="muted small" style="margin:0">This run did not create Salesforce records.</p>`}</div></div>
        <div class="card"><div class="card-head"><h2>Cleanup</h2></div><div class="card-body">
        ${run.environment === 'Production' ? h`<div class="callout warn">${ic('shield')}<div class="small">Automatic cleanup never runs in Production. Records are not created or deleted automatically there.</div></div>` : cl ? C.kv([['Attempted', fmt.num(cl.attempted)], ['Deleted', fmt.num(cl.deleted)], ['Errors', cl.errors && cl.errors.length ? h`<ul class="list">${cl.errors.slice(0, 10).map((x) => h`<li class="small">${typeof x === 'string' ? x : JSON.stringify(x)}</li>`)}</ul>` : 'None']]) : h`<p class="muted small" style="margin:0">${state.live ? 'Cleanup runs after the last test completes.' : 'Cleanup was not performed for this run.'}</p>`}
        </div></div></div>`);
    }

    async function refreshAll() {
      try {
        [run, results] = await Promise.all([api.get(`/api/runs/${run.id}`), loadAllResults(run.id)]);
        results.forEach((r, i) => { cells[i] = { ...r }; });
        drawHead(); drawRibbon(); drawTabs(); drawPane();
        QA.state.emit('defects-changed');
      } catch (e) { toastError(e); }
    }

    drawHead(); drawRibbon(); drawLive(); drawTabs(); drawPane();

    on(view, 'click', '[data-act=stop]', (e, el) => withBusy(el, async () => {
      const ok = await QA.ui.confirm({ title: 'Stop this run?', message: 'The test in progress finishes, remaining tests are marked skipped, and created test data is still cleaned up (outside Production).', confirmLabel: 'Stop run', danger: true });
      if (!ok) return;
      try { await api.post(`/api/runs/${run.id}/stop`); toast('Stopping after the current test…', 'warn', 'Stop requested'); } catch (err) { toastError(err); }
    }));
    on(view, 'click', '[data-act=rerun-failed]', (e, el) => C.startRun({ mode: 'failed', fromRunId: run.id }, el));

    // Live stream
    let close = () => {};
    if (state.live) {
      const t = () => new Date().toLocaleTimeString();
      const log = (text, cls) => { state.log.push({ t: t(), text, cls }); drawLive(); };
      log(`Connected to ${run.id} — ${run.total} tests queued in ${run.environment}.`);
      let redrawTimer = null;
      const scheduleRedraw = () => { if (redrawTimer) return; redrawTimer = setTimeout(() => { redrawTimer = null; drawHead(); drawRibbon(); if (state.tab === 'results') drawResults(); }, 120); };
      close = api.stream(`/api/runs/${run.id}/stream`, {
        'test-start': (e) => { if (cells[e.index]) { cells[e.index] = { ...cells[e.index], status: 'running', title: e.title, testCaseId: e.testCaseId }; scheduleRedraw(); } },
        'test-result': (e) => {
          cells[e.index] = { ...e.result };
          Object.assign(run, e.counts || {});
          if (e.result.status !== 'passed') log(`#${e.result.seq} ${e.result.status.toUpperCase()} ${e.result.title}${e.result.reason ? ` — ${e.result.reason}` : ''}`, e.result.status === 'failed' ? 'text-error' : 'text-warn');
          scheduleRedraw();
        },
        notice: (e) => log(e.message, 'text-warn'),
        stopping: () => log('Stop requested — finishing the current test.', 'text-warn'),
        'cleanup-start': (e) => log(`Cleaning up ${e.count} test records…`),
        'run-end': async (e) => {
          log(`Run ${e.status}. ${e.counts ? `${e.counts.passed} passed, ${e.counts.failed} failed, ${e.counts.blocked} blocked, ${e.counts.skipped} skipped.` : ''}`);
          state.live = false; close();
          QA.state.notify({ title: `Run ${run.id} ${e.status}`, message: e.counts ? `${e.counts.passed} passed · ${e.counts.failed} failed · ${e.counts.blocked} blocked` : e.error || '', kind: e.counts && e.counts.failed ? 'error' : 'ok' });
          await refreshAll(); drawLive();
        },
        error: () => { /* EventSource retries automatically */ },
      });
    }
    return () => close();
  }

  async function loadAllResults(runId) {
    const out = [];
    for (let page = 1; page <= 20; page++) {
      const r = await api.get(`/api/runs/${encodeURIComponent(runId)}/results?pageSize=200&page=${page}&sort=seq&dir=ASC`);
      out.push(...r.items);
      if (QA.api.snapshot || page >= r.pages) break;
    }
    return out;
  }
})();
</script>
  <script>/* Defects: Jira defects raised from failed tests; status sync and confirmed updates. */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, badge, on, empty, toast, toastError, esc, drawer, loading, errorBox, withBusy, confirm } = QA.ui;
  const C = QA.components;
  const api = QA.api;
  const SEVERITIES = ['Critical', 'High', 'Medium', 'Low'];
  const STATUSES = ['Open', 'In Progress', 'Reopened', 'Resolved', 'Closed'];

  QA.pages.defects = {
    render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Defects' }]);
      view.innerHTML = String(h`${C.pageHead('Defects', h`Jira defects raised from failed API tests in ${p.jiraProjectKey || 'Jira'}. Defects are only created after you review the preview and click "Create Jira defect".`,
        h`<a class="btn" href="/execution?status=completed" data-link>${ic('play')} Find failures to triage</a>`)}
        <div class="callout info" style="margin-bottom:16px">${ic('shield')}<div class="small">Workflow: failure detected → analysed → draft generated → you review the preview → you click Create → linked to the story → key stored on the result. Credentials, tokens and session IDs are masked in every defect.</div></div>
        <div data-list></div>`);
      const list = C.listController(view.querySelector('[data-list]'), {
        sort: 'createdAt', dir: 'DESC', q: ctx.query.q || '', searchPlaceholder: 'Search key, summary or endpoint',
        filters: { status: ctx.query.status || '', severity: ctx.query.severity || '' },
        toolbar: (s) => h`${C.chipGroup('severity', SEVERITIES, (s.filters.severity || '').split(','))}<select class="select" data-filter="status" aria-label="Status"><option value="">Any status</option>${STATUSES.map((x) => h`<option ${s.filters.status === x ? 'selected' : ''}>${x}</option>`)}</select>`,
        fetch: (q) => api.get(`/api/defects${api.qs({ projectId: p.id, ...q })}`),
        rowAttrs: (r) => `data-id="${esc(r.id)}"`,
        onRow: (r) => openDefect(r.id, list),
        emptyState: (s) => empty({ icon: 'bug', title: s.q || s.filters.status || s.filters.severity ? 'No defects match' : 'No defects yet', text: 'Open a failed result in an execution and choose "Preview Jira defect".' }),
        columns: [
          { key: 'key', label: 'Key', sortable: true, render: (r) => h`<b class="mono small">${r.key}</b>` },
          { key: 'summary', label: 'Summary', render: (r) => h`<div class="cell-title">${r.summary}</div><div class="cell-sub mono">${r.endpoint || ''}</div>` },
          { key: 'severity', label: 'Severity', sortable: true, render: (r) => badge(r.severity) },
          { key: 'status', label: 'Status', sortable: true, render: (r) => badge(r.status) },
          { key: 'storyKey', label: 'Story', render: (r) => (r.storyKey ? h`<a href="/stories/${r.storyKey}" data-link class="small">${r.storyKey}</a>` : '–') },
          { key: 'testCaseId', label: 'Test', render: (r) => h`<a href="/testcases?id=${r.testCaseId}" data-link class="mono small">${r.testCaseId}</a>` },
          { key: 'createdAt', label: 'Created', sortable: true, render: (r) => h`${fmt.ago(r.createdAt)}<div class="cell-sub">${r.createdBy}</div>` },
        ],
      });
      return null;
    },
  };

  async function openDefect(id, list) {
    const d = drawer({ title: 'Loading defect…', body: loading(8), foot: h``, width: 820 });
    let x;
    try { x = await api.get(`/api/defects/${encodeURIComponent(id)}`); } catch (e) { d.setBody(errorBox(e)); return; }
    d.el.querySelector('#d-title').textContent = `${x.key} · ${x.summary}`;
    d.setBody(h`<div class="row wrap" style="gap:8px;margin-bottom:14px">${badge(x.severity)}${badge(x.status)}${(x.labels || []).map((l) => h`<span class="tag">${l}</span>`)}</div>
      ${C.kv([['Jira', x.url ? h`<a href="${x.url}" target="_blank" rel="noopener">${x.key} ${QA.ui.ic('external')}</a>` : x.key], ['Story', x.storyKey ? h`<a href="/stories/${x.storyKey}" data-link>${x.storyKey}</a>` : null], ['Test case', h`<a href="/testcases?id=${x.testCaseId}" data-link>${x.testCaseId}</a>`], ['Execution', x.runId ? h`<a href="/execution/${x.runId}" data-link class="mono">${x.runId}</a>` : null], ['Result', x.resultId ? h`<button class="btn xs" data-res="${x.resultId}">Open request/response</button>` : null], ['Created', `${fmt.date(x.createdAt)} by ${x.createdBy}`], ['Resolved', x.resolvedAt ? fmt.date(x.resolvedAt) : null]])}
      <div class="form-grid mt">
        <label class="field"><span>Severity</span><select class="select" name="severity">${SEVERITIES.map((s) => h`<option ${x.severity === s ? 'selected' : ''}>${s}</option>`)}</select></label>
        <label class="field"><span>Status</span><select class="select" name="status">${STATUSES.map((s) => h`<option ${x.status === s ? 'selected' : ''}>${s}</option>`)}</select></label>
        <label class="field full"><span>Comment for Jira (optional)</span><textarea class="input" rows="2" name="comment" placeholder="e.g. Retested in QA run EX-…; still failing."></textarea></label>
      </div>
      <h3 class="mt">Description</h3><pre class="code" style="white-space:pre-wrap">${x.description || ''}</pre>`);
    d.setFoot(h`<button class="btn" data-act="sync">${ic('refresh')} Sync status from Jira</button><span class="spacer"></span><button class="btn" data-act="local">Save locally</button><button class="btn primary" data-act="push">${ic('jira')} Save and update Jira</button>`);
    on(d.el, 'click', '[data-res]', (e, el) => C.openResult(el.dataset.res));
    on(d.el, 'click', '[data-link]', () => d.close());
    const vals = () => ({ severity: d.el.querySelector('[name=severity]').value, status: d.el.querySelector('[name=status]').value, comment: d.el.querySelector('[name=comment]').value.trim() || undefined });
    on(d.el, 'click', '[data-act=local]', (e, el) => withBusy(el, async () => { try { const v = vals(); delete v.comment; await api.put(`/api/defects/${x.id}`, v); toast(`${x.key} saved locally. Jira was not changed.`, 'ok'); d.close(); list.reload(); QA.state.emit('defects-changed'); } catch (err) { toastError(err); } }));
    on(d.el, 'click', '[data-act=push]', (e, el) => withBusy(el, async () => {
      const v = vals();
      const ok = await confirm({ title: `Update ${x.key} in Jira?`, message: h`Severity <b>${v.severity}</b>, status <b>${v.status}</b>${v.comment ? ' and your comment' : ''} will be sent to Jira.`, confirmLabel: 'Update Jira' });
      if (!ok) return;
      try { await api.put(`/api/defects/${x.id}`, { ...v, pushToJira: true, confirmed: true }); toast(`${x.key} updated in Jira.`, 'ok'); d.close(); list.reload(); QA.state.emit('defects-changed'); } catch (err) { toastError(err, 'Jira not updated'); }
    }));
    on(d.el, 'click', '[data-act=sync]', (e, el) => withBusy(el, async () => { try { const r = await api.post(`/api/defects/${x.id}/sync`); toast(`${x.key} is ${r.status} in Jira.`, 'ok'); d.close(); list.reload(); QA.state.emit('defects-changed'); } catch (err) { toastError(err, 'Sync failed'); } }));
  }
})();
</script>
  <script>/* Traceability (story → scenario → case → execution → result → defect) and regression impact. */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, badge, prov, pri, method, on, errorBox, loading, empty, toast, toastError, withBusy, esc } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.traceability = {
    render(view, ctx) {
      if (!QA.state.project) { view.innerHTML = String(C.projectRequired()); return null; }
      return ctx.path === '/regression' ? renderRegression(view, ctx) : renderTrace(view, ctx);
    },
  };

  async function renderTrace(view, ctx) {
    const p = QA.state.project;
    QA.router.setCrumbs([{ label: 'Traceability' }]);
    view.innerHTML = String(h`${C.pageHead('Traceability', 'Every requirement traced to scenarios, test cases, the latest execution, its result and any defect.', h`<a class="btn" href="/regression" data-link>${ic('target')} Regression impact</a>`)}<div data-body>${loading(10)}</div>`);
    let d;
    try { d = await api.get(`/api/traceability?projectId=${p.id}`); } catch (e) { view.querySelector('[data-body]').innerHTML = String(errorBox(e)); return null; }
    const m = d.metrics;
    const state = { q: ctx.query.q || '', only: ctx.query.only || '' };
    const body = view.querySelector('[data-body]');
    const k = (label, value, foot, tone = '') => h`<div class="kpi ${tone}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${foot ? h`<div class="kpi-foot">${foot}</div>` : ''}</div>`;
    body.innerHTML = String(h`<div class="kpis" style="--cols:6">
        ${k('Requirement coverage', `${m.coveragePct}%`, `${m.storiesCovered} of ${m.storiesTotal} stories`, m.coveragePct >= 90 ? 'ok' : m.coveragePct >= 70 ? 'warn' : 'bad')}
        ${k('Tests generated', fmt.num(m.testsGenerated))}
        ${k('Executed', `${m.executionPct}%`, `${m.testsExecuted} tests`)}
        ${k('Passed / failed', h`<span class="text-ok">${m.passed}</span> / <span class="text-error">${m.failed}</span>`, `${m.blocked} blocked`)}
        ${k('Defects created', fmt.num(m.defectsCreated))}
        ${k('Defects resolved', fmt.num(m.defectsResolved))}
      </div>
      <div class="card mt"><div class="toolbar"><input class="input search" type="search" placeholder="Filter stories, scenarios or tests" value="${state.q}" data-q aria-label="Filter">
        ${C.chipGroup('only', [{ value: 'failed', label: 'Has failures' }, { value: 'untested', label: 'Not executed' }, { value: 'uncovered', label: 'No tests' }, { value: 'defects', label: 'Has defects' }], [state.only])}
        <span class="spacer"></span><button class="btn sm" data-expand="1">Expand all</button><button class="btn sm" data-expand="0">Collapse all</button></div>
        <div class="card-body flush"><div class="tree" data-tree></div></div></div>`);
    const tree = body.querySelector('[data-tree]');
    const draw = () => {
      const q = state.q.toLowerCase();
      const match = (s) => !q || JSON.stringify([s.key, s.summary, s.scenarios.map((x) => [x.title, x.tests.map((t) => [t.id, t.title, t.endpoint])])]).toLowerCase().includes(q);
      const filt = (s) => {
        const tests = s.scenarios.flatMap((x) => x.tests);
        if (state.only === 'failed') return tests.some((t) => t.execution && t.execution.status === 'failed');
        if (state.only === 'untested') return tests.some((t) => !t.execution);
        if (state.only === 'uncovered') return !tests.length;
        if (state.only === 'defects') return tests.some((t) => t.defects.length);
        return true;
      };
      const rows = d.tree.filter((s) => match(s) && filt(s));
      tree.innerHTML = String(rows.length ? h`${rows.map((s) => {
        const tests = s.scenarios.flatMap((x) => x.tests);
        const failed = tests.filter((t) => t.execution && t.execution.status === 'failed').length;
        const defects = tests.reduce((n, t) => n + t.defects.length, 0);
        return h`<details ${q || state.only ? 'open' : ''}><summary><span class="row" style="gap:8px;flex:1;min-width:0">${ic('jira')}<a href="/stories/${s.key}" data-link class="mono small"><b>${s.key}</b></a><span class="truncate">${s.summary}</span><span class="spacer"></span><span class="tag">${s.status}</span>${tests.length ? h`<span class="small muted num">${tests.length} tests</span>` : h`<span class="badge blocked plain">No tests</span>`}${failed ? h`<span class="badge failed">${failed} failed</span>` : ''}${defects ? h`<span class="badge Open plain">${ic('bug')} ${defects}</span>` : ''}</span></summary>
          ${s.scenarios.length ? s.scenarios.map((sc) => h`<details style="margin-left:18px"><summary><span class="row" style="gap:8px;flex:1;min-width:0">${ic('layers')}<span class="truncate">${sc.title}</span><span class="spacer"></span><span class="tag">${sc.type}</span>${pri(sc.priority)}${prov(sc.label)}</span></summary>
            ${sc.tests.map((t) => h`<div class="leaf row wrap" style="gap:8px;margin-left:22px">
              <a href="/testcases?id=${t.id}" data-link class="mono small">${t.id}</a><span class="truncate" style="max-width:380px">${t.title}</span>${method(t.method)}
              <span class="spacer"></span>
              ${t.execution ? h`<a href="/execution/${t.execution.runId}" data-link class="mono small faint">${t.execution.runId}</a><button class="btn xs ghost" data-res="${t.execution.id}">${badge(t.execution.status)} ${t.execution.statusCode || ''} · ${fmt.ms(t.execution.responseMs)}</button>` : h`<span class="faint small">Not executed</span>`}
              ${t.defects.map((x) => h`<a class="badge ${x.status === 'Open' ? 'Open' : 'ok'} plain" href="/defects?q=${x.key}" data-link>${ic('bug')} ${x.key}</a>`)}
            </div>`)}</details>`) : h`<p class="small muted" style="margin:6px 0 10px 26px">No scenarios. <a href="/stories/${s.key}" data-link>Generate API tests</a> for this story.</p>`}
        </details>`;
      })}` : empty({ icon: 'tree', title: 'Nothing matches', text: 'Clear the filter to see the full traceability tree.' }));
    };
    draw();
    on(body, 'input', '[data-q]', QA.ui.debounce((e) => { state.q = e.target.value.trim(); QA.router.setQuery({ q: state.q }); draw(); }, 200));
    on(body, 'click', '[data-chip=only]', (e, el) => { state.only = state.only === el.dataset.value ? '' : el.dataset.value; body.querySelectorAll('[data-chip=only]').forEach((c) => { c.classList.toggle('on', c.dataset.value === state.only); c.setAttribute('aria-pressed', c.dataset.value === state.only); }); QA.router.setQuery({ only: state.only }); draw(); });
    on(body, 'click', '[data-expand]', (e, el) => tree.querySelectorAll('details').forEach((x) => { x.open = el.dataset.expand === '1'; }));
    on(body, 'click', '[data-res]', (e, el) => { e.preventDefault(); C.openResult(el.dataset.res); });
    return null;
  }

  async function renderRegression(view, ctx) {
    const p = QA.state.project;
    QA.router.setCrumbs([{ label: 'Traceability', href: '/traceability' }, { label: 'Regression impact' }]);
    let objects = [];
    try { objects = (await api.get(`/api/projects/${p.id}/sobjects`, { cacheMs: 300000 })).objects.map((o) => o.name); } catch { /* manual entry still works */ }
    view.innerHTML = String(h`${C.pageHead('Regression impact', 'Pick what changed — a story, objects or endpoints. Impacted tests are ranked by priority, and the P0 regression pack is always included.')}
      <div class="grid g-12"><div class="card" style="align-self:start"><div class="card-head"><h2>What changed?</h2></div><div class="card-body stack">
        <label class="field"><span>Story key</span><input class="input mono" name="story" value="${ctx.query.story || ''}" placeholder="e.g. DEMO-102"><small>Objects mentioned in the story are added automatically.</small></label>
        <div class="field"><span>Changed objects</span>${objects.length ? C.chipGroup('obj', objects, (ctx.query.objects || '').split(',')) : h`<input class="input mono" name="objtext" placeholder="Account, Contact">`}</div>
        <label class="field"><span>Changed endpoints (one per line, partial match)</span><textarea class="input mono" rows="3" name="eps" placeholder="/services/apexrest/v1/invoices"></textarea></label>
        <button class="btn primary" data-act="analyse">${ic('target')} Find impacted tests</button></div></div>
        <div class="card" data-out>${empty({ icon: 'target', title: 'No analysis yet', text: 'Choose a story, objects or endpoints, then find impacted tests.' })}</div></div>`);
    const sel = new Set((ctx.query.objects || '').split(',').filter(Boolean));
    on(view, 'click', '[data-chip=obj]', (e, el) => { sel.has(el.dataset.value) ? sel.delete(el.dataset.value) : sel.add(el.dataset.value); el.classList.toggle('on'); el.setAttribute('aria-pressed', sel.has(el.dataset.value)); });
    let last = null;
    const analyse = (btn) => withBusy(btn, async () => {
      const objs = view.querySelector('[name=objtext]') ? view.querySelector('[name=objtext]').value.split(',').map((x) => x.trim()).filter(Boolean) : [...sel];
      const body = { storyKey: view.querySelector('[name=story]').value.trim() || undefined, objects: objs, endpoints: view.querySelector('[name=eps]').value.split('\n').map((x) => x.trim()).filter(Boolean) };
      const out = view.querySelector('[data-out]');
      try {
        last = await api.post(`/api/regression/impact?projectId=${p.id}`, body);
        out.innerHTML = String(h`<div class="card-head"><h2>${last.impacted.length} impacted tests</h2><div class="row">${prov(last.label)}<button class="btn sm primary" data-act="runimpact" ${last.impacted.length ? '' : 'disabled'}>${ic('play')} Run impacted tests</button></div></div>
          ${last.objects.length ? h`<div class="card-body small muted" style="padding-bottom:0">Objects: ${last.objects.join(', ')}</div>` : ''}
          ${QA.ui.table({ rows: last.impacted, emptyState: empty({ title: 'No impacted tests', text: 'No tests touch these objects or endpoints.' }), columns: [
            { key: 'id', label: 'Test', render: (r) => h`<a href="/testcases?id=${r.id}" data-link class="mono small">${r.id}</a>` }, { key: 'title', label: 'Title' }, { key: 'priority', label: 'Pri', render: (r) => pri(r.priority) },
            { key: 'object', label: 'Object', render: (r) => h`<span class="mono small">${r.object || '–'}</span>` }, { key: 'reason', label: 'Why', render: (r) => h`<span class="small">${r.reason}</span>` }, { key: 'lastResult', label: 'Last', render: (r) => (r.lastResult ? badge(r.lastResult) : '–') },
          ] })}`);
      } catch (err) { out.innerHTML = String(h`<div class="card-body">${errorBox(err)}</div>`); }
    });
    on(view, 'click', '[data-act=analyse]', (e, el) => analyse(el));
    on(view, 'click', '[data-act=runimpact]', (e, el) => C.startRun({ testCaseIds: last.impacted.map((t) => t.id), label: `Regression: ${last.objects.join(', ') || 'impacted tests'}`, trigger: 'regression' }, el));
    if (ctx.query.story || ctx.query.objects) analyse(view.querySelector('[data-act=analyse]'));
    return null;
  }
})();
</script>
  <script>/* Test data manager: datasets by category, generation from describe, CSV/JSON import, tracked cleanup. */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, on, empty, toast, toastError, withBusy, esc, modal, confirm, json } = QA.ui;
  const C = QA.components;
  const api = QA.api;
  const CATEGORIES = ['Positive', 'Negative', 'Boundary', 'Integration', 'Regression', 'Performance'];

  QA.pages.testdata = {
    render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Test data' }]);
      const prod = p.environment === 'Production';
      view.innerHTML = String(h`${C.pageHead('Test data', 'Reusable payloads by category. Records created during runs are tracked and cleaned up automatically outside Production.',
        h`<button class="btn" data-act="cleanup" ${prod ? 'disabled title="Disabled in Production"' : ''}>${ic('trash')} Clean up run data</button><button class="btn" data-act="import">${ic('upload')} Import CSV/JSON</button><button class="btn" data-act="new">${ic('plus')} New dataset</button><button class="btn primary" data-act="generate">${ic('wand')} Generate</button>`)}
        ${prod ? h`<div class="callout error" style="margin-bottom:16px">${ic('shield')}<div class="small">Production: records are never created or deleted automatically. Use these payloads for read-only verification only.</div></div>` : ''}
        <div data-list></div>`);
      const list = C.listController(view.querySelector('[data-list]'), {
        sort: 'createdAt', searchPlaceholder: 'Search name, object, story or notes', filters: { category: ctx.query.category || '' },
        toolbar: (s) => C.chipGroup('category', CATEGORIES, (s.filters.category || '').split(',')),
        fetch: (q) => api.get(`/api/testdata${api.qs({ projectId: p.id, ...q })}`),
        rowAttrs: (r) => `data-id="${esc(r.id)}"`,
        onRow: (r) => editDialog(r, list),
        emptyState: () => empty({ icon: 'database', title: 'No test data', text: 'Generate datasets from object metadata or import a CSV/JSON file.' }),
        columns: [
          { key: 'id', label: 'Id', render: (r) => h`<span class="mono small">${r.id}</span>` },
          { key: 'name', label: 'Dataset', render: (r) => h`<div class="cell-title">${r.name}</div><div class="cell-sub">${r.notes || ''}</div>` },
          { key: 'category', label: 'Category', render: (r) => h`<span class="tag">${r.category}</span>` },
          { key: 'object', label: 'Object', render: (r) => h`<span class="mono small">${r.object || '–'}</span>` },
          { key: 'storyKey', label: 'Story', render: (r) => r.storyKey || '–' },
          { key: 'payload', label: 'Payload', render: (r) => h`<code class="mono small truncate" style="display:block;max-width:320px">${JSON.stringify(r.payload)}</code>` },
          { key: 'updatedAt', label: 'Updated', render: (r) => fmt.ago(r.updatedAt) },
        ],
      });

      on(view, 'click', '[data-act=new]', () => editDialog(null, list));
      on(view, 'click', '[data-act=generate]', () => {
        modal({
          title: 'Generate test data', subtitle: `Built from the object describe (${p.connection.metadataLabel}).`,
          body: h`<div class="form-grid"><label class="field"><span>Object</span><input class="input mono" name="object" placeholder="Contact" value="Contact"></label>
            <label class="field"><span>Category</span><select class="select" name="category">${CATEGORIES.map((c) => h`<option>${c}</option>`)}</select></label>
            <label class="field"><span>How many</span><input class="input" type="number" name="count" min="1" max="50" value="3"></label>
            <label class="field"><span>Story key (optional)</span><input class="input mono" name="storyKey"></label></div>`,
          foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>${ic('wand')} Generate</button>`,
          onMount(el, close) {
            el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
              const v = (n) => el.querySelector(`[name=${n}]`).value.trim();
              try { const r = await api.post(`/api/testdata/generate?projectId=${p.id}`, { object: v('object'), category: v('category'), count: Number(v('count')), storyKey: v('storyKey') || undefined }); close(); toast(`${r.created} datasets generated.`, 'ok'); list.reload(); } catch (err) { toastError(err, 'Generation failed'); }
            }));
          },
        });
      });
      on(view, 'click', '[data-act=import]', () => {
        modal({
          title: 'Import test data', size: 'wide', subtitle: 'CSV needs a header row. JSON can be an object or an array of objects. Secret-looking values are masked on import.',
          body: h`<div class="form-grid"><label class="field"><span>Format</span><select class="select" name="format"><option value="csv">CSV</option><option value="json">JSON</option></select></label>
            <label class="field"><span>Category</span><select class="select" name="category">${CATEGORIES.map((c) => h`<option>${c}</option>`)}</select></label>
            <label class="field"><span>Object</span><input class="input mono" name="object" placeholder="Account"></label>
            <label class="field"><span>File</span><input class="input" type="file" name="file" accept=".csv,.json,text/csv,application/json"></label>
            <label class="field full"><span>Or paste content</span><textarea class="input mono" rows="8" name="content" placeholder="Name,Industry&#10;QA Import 1,Banking"></textarea></label></div>`,
          foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>${ic('upload')} Import</button>`,
          onMount(el, close) {
            el.querySelector('[name=file]').addEventListener('change', async (e) => { const file = e.target.files[0]; if (!file) return; el.querySelector('[name=content]').value = await file.text(); el.querySelector('[name=format]').value = /\.json$/i.test(file.name) ? 'json' : 'csv'; });
            el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
              const v = (n) => el.querySelector(`[name=${n}]`).value;
              try { const r = await api.post(`/api/testdata/import?projectId=${p.id}`, { format: v('format'), category: v('category'), object: v('object').trim() || undefined, content: v('content') }); close(); toast(`${r.created} records imported.`, 'ok'); list.reload(); } catch (err) { toastError(err, 'Import failed'); }
            }));
          },
        });
      });
      on(view, 'click', '[data-act=cleanup]', (e, el) => withBusy(el, async () => {
        try {
          const prev = await api.post(`/api/testdata/cleanup?projectId=${p.id}`, {});
          if (!prev.preview) { toast(prev.message || 'Nothing to clean up.', 'info'); return; }
          const ok = await confirm({ title: 'Delete tracked test records?', message: h`${prev.message} Only records created by this platform's runs are included.`, confirmLabel: `Delete ${prev.count} records`, danger: true });
          if (!ok) return;
          const r = await api.post(`/api/testdata/cleanup?projectId=${p.id}`, { confirmed: true });
          toast(`${r.deleted} of ${r.attempted} records deleted.${r.errors && r.errors.length ? ` ${r.errors.length} errors.` : ''}`, r.errors && r.errors.length ? 'warn' : 'ok', 'Cleanup complete');
        } catch (err) { toastError(err, 'Cleanup failed'); }
      }));
      return null;
    },
  };

  function editDialog(r, list) {
    const p = QA.state.project;
    modal({
      title: r ? `Edit ${r.id}` : 'New dataset', size: 'wide',
      body: h`<div class="form-grid"><label class="field full"><span>Name</span><input class="input" name="name" value="${r ? r.name : ''}"></label>
        <label class="field"><span>Category</span><select class="select" name="category">${CATEGORIES.map((c) => h`<option ${r && r.category === c ? 'selected' : ''}>${c}</option>`)}</select></label>
        <label class="field"><span>Object</span><input class="input mono" name="object" value="${r ? r.object || '' : ''}"></label>
        <label class="field"><span>Story key</span><input class="input mono" name="storyKey" value="${r ? r.storyKey || '' : ''}"></label>
        <label class="field full"><span>Payload (JSON)</span><textarea class="input mono" rows="10" name="payload" spellcheck="false">${JSON.stringify(r ? r.payload : {}, null, 2)}</textarea><small>Reference in tests with variables; never store credentials here.</small></label>
        <label class="field full"><span>Notes</span><input class="input" name="notes" value="${r ? r.notes || '' : ''}"></label></div>`,
      foot: h`${r ? h`<button class="btn danger-outline" data-del>${ic('trash')} Delete</button>` : ''}<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" data-go>Save</button>`,
      onMount(el, close) {
        el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
          const v = (n) => el.querySelector(`[name=${n}]`).value.trim();
          let payload;
          try { payload = JSON.parse(v('payload') || '{}'); } catch (err) { toastError({ message: `Payload is not valid JSON: ${err.message}`, info: {} }); return; }
          const b = { name: v('name'), category: v('category'), object: v('object') || null, storyKey: v('storyKey') || null, payload, notes: v('notes') || null };
          try { if (r) await api.put(`/api/testdata/${r.id}`, b); else await api.post(`/api/testdata?projectId=${p.id}`, b); close(); toast('Dataset saved.', 'ok'); list.reload(); } catch (err) { toastError(err, 'Not saved'); }
        }));
        const del = el.querySelector('[data-del]');
        if (del) del.addEventListener('click', async () => { try { await api.del(`/api/testdata/${r.id}`); close(); toast('Dataset deleted.', 'warn'); list.reload(); } catch (err) { toastError(err); } });
      },
    });
  }
})();
</script>
  <script>/* API contracts: OpenAPI / Swagger / JSON Schema upload, run validation and an ad-hoc playground. */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, badge, method, on, errorBox, loading, empty, toast, toastError, withBusy, esc, modal, confirm } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.contracts = {
    async render(view) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Contracts' }]);
      view.innerHTML = String(h`${C.pageHead('API contracts', 'Validate responses against OpenAPI 3, Swagger 2 or JSON Schema: required fields, types, enums, formats, status codes and headers.', h`<button class="btn primary" data-act="upload">${ic('upload')} Upload contract</button>`)}
        <div class="grid g-12"><div class="card" style="align-self:start" data-list>${loading(4)}</div><div data-detail>${'' }</div></div>`);
      let list = [];
      let current = null;
      const listEl = view.querySelector('[data-list]');
      const detail = view.querySelector('[data-detail]');
      async function loadList() {
        try {
          list = await api.get(`/api/contracts?projectId=${p.id}`);
          listEl.innerHTML = String(h`<div class="card-head"><h2>Contracts</h2><span class="small muted">${list.length}</span></div>${list.length ? h`<div class="side-list">${list.map((c) => h`<button class="item ${current === c.id ? 'on' : ''}" data-c="${c.id}" style="flex-direction:column;align-items:flex-start;gap:2px"><span>${c.name}</span><span class="small muted">${c.kind} · ${c.operations} operations · ${c.linkedTests} linked tests</span></button>`)}</div>` : empty({ icon: 'file', title: 'No contracts', text: 'Upload an OpenAPI, Swagger or JSON Schema document.' })}`);
          if (!current && list[0]) open(list[0].id);
          if (!list.length) detail.innerHTML = '';
        } catch (e) { listEl.innerHTML = String(h`<div class="card-body">${errorBox(e)}</div>`); }
      }
      async function open(id) {
        current = id;
        listEl.querySelectorAll('[data-c]').forEach((b) => b.classList.toggle('on', b.dataset.c === id));
        detail.innerHTML = String(h`<div class="card">${loading(8)}</div>`);
        try {
          const c = await api.get(`/api/contracts/${id}`);
          detail.innerHTML = String(h`<div class="card"><div class="card-head"><h2>${c.name} <span class="sub">${c.kind} · uploaded ${fmt.date(c.createdAt)}</span></h2><div class="row"><button class="btn sm" data-act="validate">${ic('check')} Validate latest run</button><button class="btn sm ghost" data-act="delete" aria-label="Delete contract">${ic('trash')}</button></div></div>
            ${QA.ui.table({ rows: c.operations, columns: [
              { key: 'method', label: 'Method', render: (o) => method(o.method) }, { key: 'path', label: 'Path', render: (o) => h`<code class="mono small">${o.path}</code>` },
              { key: 'summary', label: 'Summary', render: (o) => h`<span class="small">${o.summary}</span><div class="cell-sub mono">${o.id}</div>` }, { key: 'responses', label: 'Responses', render: (o) => h`${(o.responses || []).map((r) => h`<span class="tag">${r}</span>`)}` },
            ] })}</div>
            <div class="mt" data-validation></div>
            <div class="card mt"><div class="card-head"><h2>Playground</h2><span class="small muted">Check a sample response against an operation</span></div><div class="card-body"><div class="form-grid">
              <label class="field"><span>Method</span><select class="select" name="pm">${['GET', 'POST', 'PATCH', 'PUT', 'DELETE'].map((m) => h`<option>${m}</option>`)}</select></label>
              <label class="field"><span>Status</span><input class="input" name="ps" type="number" value="200"></label>
              <label class="field full"><span>Path</span><input class="input mono" name="pp" value="${(c.operations[0] || {}).path || '/'}"></label>
              <label class="field full"><span>Response body (JSON)</span><textarea class="input mono" rows="7" name="pb" spellcheck="false">{}</textarea></label></div>
              <div class="row mt"><button class="btn primary" data-act="check">Check response</button><span data-checkout></span></div></div></div>`);
        } catch (e) { detail.innerHTML = String(errorBox(e)); }
      }
      on(listEl, 'click', '[data-c]', (e, el) => open(el.dataset.c));
      on(detail, 'click', '[data-act=validate]', (e, el) => withBusy(el, async () => {
        const out = detail.querySelector('[data-validation]');
        try {
          const r = await api.post(`/api/contracts/${current}/validate`, {});
          const rows = r.checks.filter((x) => x.status !== 'NOT_APPLICABLE');
          out.innerHTML = String(h`<div class="card"><div class="card-head"><h2>Validation of <a href="/execution/${r.runId}" data-link class="mono">${r.runId}</a></h2><span class="stat-inline"><span><b>${r.applicable}</b> applicable</span><span><b class="text-ok">${r.passed}</b> pass</span><span><b class="text-error">${r.failed}</b> fail</span></span></div>
            ${QA.ui.table({ rows, rowAttrs: (x) => `data-res="${esc(x.resultId)}"`, emptyState: empty({ title: 'No results matched this contract', text: 'None of the executed endpoints are declared in this contract.' }), columns: [
              { key: 'status', label: 'Contract', render: (x) => badge(x.status) }, { key: 'title', label: 'Test', render: (x) => h`<div class="cell-title">${x.title}</div><div class="cell-sub">${C.endpoint(x.method, x.endpoint)} · HTTP ${x.statusCode}</div>` },
              { key: 'violations', label: 'Violations', render: (x) => (x.violations.length ? h`<ul class="list small" style="margin:0">${x.violations.slice(0, 4).map((v) => h`<li><code class="mono">${v.path || '$'}</code> ${v.message}</li>`)}</ul>` : h`<span class="faint small">None</span>`) },
            ] })}</div>`);
        } catch (err) { out.innerHTML = String(errorBox(err)); }
      }));
      on(detail, 'click', 'tr[data-res]', (e, el) => { if (!e.target.closest('a')) C.openResult(el.dataset.res); });
      on(detail, 'click', '[data-act=check]', (e, el) => withBusy(el, async () => {
        const v = (n) => detail.querySelector(`[name=${n}]`).value;
        const out = detail.querySelector('[data-checkout]');
        try {
          const r = await api.post(`/api/contracts/${current}/check`, { method: v('pm'), status: Number(v('ps')), path: v('pp'), body: v('pb') });
          out.innerHTML = String(h`${badge(r.status)} <span class="small muted">${r.operation || ''}</span>${r.violations.length ? h`<ul class="list small">${r.violations.map((x) => h`<li><code class="mono">${x.path || '$'}</code> ${x.message}</li>`)}</ul>` : ''}`);
        } catch (err) { out.innerHTML = String(errorBox(err, { compact: true })); }
      }));
      on(detail, 'click', '[data-act=delete]', async () => {
        const ok = await confirm({ title: 'Delete this contract?', message: 'Linked tests keep running but contract checks are skipped.', confirmLabel: 'Delete', danger: true });
        if (!ok) return;
        try { await api.del(`/api/contracts/${current}`); current = null; toast('Contract deleted.', 'warn'); loadList(); } catch (err) { toastError(err); }
      });
      on(view, 'click', '[data-act=upload]', () => {
        modal({
          title: 'Upload contract', size: 'wide', subtitle: 'OpenAPI 3.x or Swagger 2.0 (JSON or YAML), or a JSON Schema document.',
          body: h`<div class="form-grid"><label class="field"><span>Name</span><input class="input" name="name" placeholder="Integration APIs v1"></label><label class="field"><span>File</span><input class="input" type="file" name="file" accept=".json,.yaml,.yml"></label>
            <label class="field full"><span>Or paste the specification</span><textarea class="input mono" rows="12" name="content" spellcheck="false" placeholder="openapi: 3.0.3&#10;info: …"></textarea></label></div>`,
          foot: h`<button class="btn" data-close>Cancel</button><button class="btn primary" data-go>${ic('upload')} Upload</button>`,
          onMount(el, close) {
            el.querySelector('[name=file]').addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; el.querySelector('[name=content]').value = await f.text(); if (!el.querySelector('[name=name]').value) el.querySelector('[name=name]').value = f.name.replace(/\.(json|ya?ml)$/i, ''); });
            el.querySelector('[data-go]').addEventListener('click', (e) => withBusy(e.currentTarget, async () => {
              const name = el.querySelector('[name=name]').value.trim(); const content = el.querySelector('[name=content]').value;
              if (!name || !content.trim()) { toast('Provide a name and the specification content.', 'warn'); return; }
              try { const c = await api.post(`/api/contracts?projectId=${p.id}`, { name, content }); close(); toast(`${c.name} uploaded with ${c.operations.length} operations.`, 'ok'); current = c.id; loadList(); open(c.id); } catch (err) { toastError(err, 'Upload failed'); }
            }));
          },
        });
      });
      loadList();
      return null;
    },
  };
})();
</script>
  <script>/* Reports: per-execution QA report preview and export (PDF, Excel, CSV, HTML). */
(() => {
  const QA = window.QA;
  const { h, raw, ic, fmt, badge, prov, on, errorBox, loading, empty, toastError, withBusy } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  QA.pages.reports = {
    async render(view, ctx) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Reports' }]);
      view.innerHTML = String(h`${C.pageHead('Reports', 'Execution reports for stakeholders. Credentials and tokens are masked in every format.')}<div data-body>${loading(8)}</div>`);
      const body = view.querySelector('[data-body]');
      let runs;
      try { runs = (await api.get(`/api/runs${api.qs({ projectId: p.id, pageSize: 50 })}`)).items; } catch (e) { body.innerHTML = String(errorBox(e)); return null; }
      if (!runs.length) { body.innerHTML = String(h`<div class="card">${empty({ icon: 'chart', title: 'No executions to report on', text: 'Run tests first; each execution produces a downloadable report.', action: h`<a class="btn primary" href="/execution" data-link>Go to execution</a>` })}</div>`); return null; }
      let runId = ctx.query.run && runs.some((r) => r.id === ctx.query.run) ? ctx.query.run : runs[0].id;
      body.innerHTML = String(h`<div class="card"><div class="toolbar"><label class="small" for="rsel">Execution</label><select class="select" id="rsel" data-run style="min-width:360px">${runs.map((r) => h`<option value="${r.id}" ${r.id === runId ? 'selected' : ''}>${r.id} · ${r.label || r.trigger || 'manual'} · ${r.passed}/${r.total} passed · ${fmt.date(r.startedAt)}</option>`)}</select>
        <span class="spacer"></span>${['pdf', 'xlsx', 'csv', 'html'].map((f) => h`<button class="btn sm" data-dl="${f}">${ic('download')} ${{ pdf: 'PDF', xlsx: 'Excel', csv: 'CSV', html: 'HTML' }[f]}</button>`)}</div></div><div class="mt" data-report>${loading(10)}</div>`);
      const out = body.querySelector('[data-report]');
      async function load() {
        out.innerHTML = String(loading(10));
        try { const d = await api.get(`/api/reports/${encodeURIComponent(runId)}?format=json`); out.innerHTML = String(renderReport(d)); } catch (e) { out.innerHTML = String(errorBox(e)); }
      }
      on(body, 'change', '[data-run]', (e, el) => { runId = el.value; QA.router.setQuery({ run: runId }); load(); });
      on(body, 'click', '[data-dl]', (e, el) => withBusy(el, async () => { try { await api.download(`/api/reports/${encodeURIComponent(runId)}?format=${el.dataset.dl}`, `qa-report-${runId}.${el.dataset.dl}`); } catch (err) { toastError(err, 'Export failed'); } }));
      load();
      return null;
    },
  };

  function renderReport(d) {
    const r = d.run;
    const k = (label, value, tone = '', foot = '') => h`<div class="kpi ${tone}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${foot ? h`<div class="kpi-foot">${foot}</div>` : ''}</div>`;
    return h`<div class="card"><div class="card-head"><h2>Executive summary</h2>${badge(d.health === 'Healthy' ? 'passed' : d.health === 'Critical' ? 'failed' : 'blocked', d.health)}</div><div class="card-body"><p style="margin:0;max-width:90ch">${d.executiveSummary}</p>
        ${d.aiSummary ? h`<div class="callout info mt">${ic('spark')}<div class="small"><b>AI analysis</b> ${prov('ASSUMED')}<div style="white-space:pre-wrap">${d.aiSummary}</div></div></div>` : ''}</div></div>
      <div class="kpis mt" style="--cols:6">${k('Pass rate', `${r.passRate}%`, r.passRate >= 95 ? 'ok' : r.passRate >= 85 ? 'warn' : 'bad')}${k('Passed', r.passed, 'ok')}${k('Failed', r.failed, r.failed ? 'bad' : '')}${k('Blocked', r.blocked, r.blocked ? 'warn' : '')}${k('Avg / p95', `${fmt.ms(r.avgResponseMs)}`, '', r.p95Ms ? `p95 ${fmt.ms(r.p95Ms)} · SLA ${fmt.ms(d.slaMs)}` : '')}${k('Defects', d.defects.length, '', `${d.defectCandidates} candidates`)}</div>
      <div class="grid g-2 mt">
        <div class="card"><div class="card-head"><h2>Coverage</h2></div><div class="card-body">${C.kv([['Project', `${d.project.name} · ${d.project.environment}`], ['Salesforce org', `${d.project.sfOrg || '–'} · API v${d.project.apiVersion}`], ['Stories covered', `${d.coverage.storiesCovered} of ${d.coverage.storiesTotal}`], ['Stories without tests', d.coverage.storiesWithoutTests.join(', ') || 'None'], ['API types', d.coverage.apiTypes.join(', ')], ['Endpoints covered', d.coverage.endpointsCovered], ['Salesforce validations', h`${d.sfValidation.passed} pass · ${d.sfValidation.failed} fail of ${d.sfValidation.total} <span class="small muted">(${d.sfValidation.label})</span>`]])}</div></div>
        <div class="card"><div class="card-head"><h2>Recommendations</h2></div><div class="card-body">${(d.recommendations || []).length ? h`<ul class="list" style="margin:0">${d.recommendations.map((x) => h`<li class="small" style="padding:6px 0">${typeof x === 'string' ? x : h`${prov(x.label)} ${x.text}`}</li>`)}</ul>` : h`<p class="small muted" style="margin:0">No recommendations.</p>`}</div></div>
      </div>
      ${d.failed.length ? h`<div class="card mt"><div class="card-head"><h2>Failed tests</h2><span class="small muted">${d.failed.length}</span></div>${QA.ui.table({ rows: d.failed, columns: [
        { key: 'id', label: 'Test', render: (x) => h`<span class="mono small">${x.id}</span>` }, { key: 'title', label: 'Title', render: (x) => h`<div class="cell-title">${x.title}</div><div class="cell-sub mono">${x.endpoint}</div>` }, { key: 'statusCode', label: 'HTTP', render: (x) => C.statusCode(x.statusCode) },
        { key: 'rootCause', label: 'Root cause', render: (x) => h`<span class="tag">${x.category || ''}</span><div class="small">${x.rootCause || ''}</div>` }, { key: 'defectKey', label: 'Defect', render: (x) => x.defectKey || h`<span class="faint small">None</span>` },
      ] })}</div>` : ''}
      <div class="card mt"><div class="card-head"><h2>Endpoint health</h2></div>${QA.ui.table({ rows: d.endpoints, columns: [
        { key: 'endpoint', label: 'Endpoint', render: (x) => h`<code class="mono small" style="word-break:break-all">${x.endpoint}</code>` }, { key: 'health', label: 'Health', render: (x) => badge(x.health) },
        { key: 'total', label: 'Tests', cls: 'num' }, { key: 'failed', label: 'Failed', cls: 'num', render: (x) => (x.failed ? h`<span class="text-error">${x.failed}</span>` : '0') }, { key: 'avg', label: 'Avg', cls: 'num', render: (x) => fmt.ms(x.avg) }, { key: 'p95', label: 'p95', cls: 'num', render: (x) => fmt.ms(x.p95) },
      ] })}</div>
      <p class="small muted mt">Generated ${fmt.date(d.generatedAt)} · ${r.id} · ${r.total} results. Download the Excel or CSV export for the full result list.</p>`;
  }
})();
</script>
  <script>/* Automation: Postman export/import, Newman runs, CI pipeline and framework structure. */
(() => {
  const QA = window.QA;
  const { h, ic, fmt, badge, on, errorBox, empty, toast, toastError, withBusy, modal, json } = QA.ui;
  const C = QA.components;
  const api = QA.api;

  const TREE = `api-tests/
├── collections/        Postman collections (exported per project)
├── environments/       Postman environments — secret values left empty
├── test-data/          Datasets exported from the Test Data manager
├── schemas/            OpenAPI / JSON Schema contracts
├── scripts/
│   ├── run-suite.js    Runs tests through the platform API (CI-friendly, JUnit output)
│   └── run-newman.js   Runs Newman with env-var credentials
├── reports/            JUnit, HTML and JSON reports (git-ignored)
└── config/             Per-environment settings (no secrets)`;

  QA.pages.automation = {
    render(view) {
      const p = QA.state.project;
      if (!p) { view.innerHTML = String(C.projectRequired()); return null; }
      QA.router.setCrumbs([{ label: 'Automation' }]);
      const m = QA.state.meta;
      view.innerHTML = String(h`${C.pageHead('Automation', 'Export approved tests as Postman collections, run them with Newman locally or in CI, and import existing collections.')}
        <div class="grid g-2">
          <div class="card"><div class="card-head"><h2>Export Postman collection</h2><span class="small muted">Collection v2.1</span></div><div class="card-body stack">
            <div class="field"><span>Priority</span>${C.chipGroup('xp', m.priorities, [])}</div>
            <div class="field"><span>Test type</span>${C.chipGroup('xt', m.testTypes, [])}</div>
            <div class="callout info">${ic('lock')}<div class="small">Requests use <code>{{baseUrl}}</code>, <code>{{accessToken}}</code>, <code>{{clientId}}</code>, <code>{{clientSecret}}</code>, <code>{{recordId}}</code>. A collection-level pre-request script fetches the token from environment variables. No secrets are written to the file.</div></div>
            <div class="row"><button class="btn primary" data-act="col">${ic('download')} Download collection</button><button class="btn" data-act="env">${ic('download')} Download ${p.environment} environment</button></div>
          </div></div>
          <div class="card"><div class="card-head"><h2>Run with Newman</h2><span class="small muted">server-side, in api-tests/</span></div><div class="card-body stack">
            <p class="small muted" style="margin:0">Writes the collection to <code>api-tests/collections/${p.id}.postman_collection.json</code> and runs <code>npx newman</code>. Requires <code>npm install</code> inside <code>api-tests/</code> and credentials in the environment file or CI secrets.</p>
            <div class="row"><button class="btn primary" data-act="newman">${ic('play')} Run Newman</button></div><div data-newman></div>
          </div></div>
        </div>
        <div class="grid g-2 mt">
          <div class="card"><div class="card-head"><h2>Import Postman collection</h2></div><div class="card-body stack">
            <label class="field"><span>Collection file (v2.1 JSON)</span><input class="input" type="file" name="pfile" accept=".json,application/json"></label>
            <label class="field"><span>Link to story (optional)</span><input class="input mono" name="pstory" placeholder="${p.jiraProjectKey || 'PROJ'}-123"></label>
            <div class="row"><button class="btn" data-act="preview">Preview import</button></div><div data-import></div>
          </div></div>
          <div class="card"><div class="card-head"><h2>CI pipeline</h2><span class="small muted">.github/workflows/api-tests.yml</span></div><div class="card-body">
            <pre class="code">${`# Credentials come from repository secrets — never committed
- run: node api-tests/scripts/run-suite.js \\
    --project ${p.id} --priority P0,P1 --junit api-tests/reports/junit.xml
  env:
    QA_PLATFORM_URL: \${{ secrets.QA_PLATFORM_URL }}
    SF_${(p.credentialRef || 'PREFIX').toUpperCase()}_CLIENT_ID: \${{ secrets.SF_CLIENT_ID }}
    SF_${(p.credentialRef || 'PREFIX').toUpperCase()}_CLIENT_SECRET: \${{ secrets.SF_CLIENT_SECRET }}`}</pre>
            <h3 class="mt">Framework structure</h3><pre class="code">${TREE}</pre>
          </div></div>
        </div>`);

      const sel = { xp: new Set(), xt: new Set() };
      on(view, 'click', '[data-chip]', (e, el) => { const s = sel[el.dataset.chip]; s.has(el.dataset.value) ? s.delete(el.dataset.value) : s.add(el.dataset.value); el.classList.toggle('on'); el.setAttribute('aria-pressed', s.has(el.dataset.value)); });
      on(view, 'click', '[data-act=col]', (e, el) => withBusy(el, async () => { try { await api.download(`/api/postman/collection${api.qs({ projectId: p.id, priority: [...sel.xp], testType: [...sel.xt] })}`, `${p.id}.postman_collection.json`); toast('Collection downloaded. Fill credentials in your Postman environment, not in the collection.', 'ok'); } catch (err) { toastError(err, 'Export failed'); } }));
      on(view, 'click', '[data-act=env]', (e, el) => withBusy(el, async () => { try { await api.download(`/api/postman/environment?projectId=${p.id}`, `${p.environment.toLowerCase()}.postman_environment.json`); } catch (err) { toastError(err, 'Export failed'); } }));
      on(view, 'click', '[data-act=newman]', (e, el) => withBusy(el, async () => {
        const out = view.querySelector('[data-newman]');
        out.innerHTML = String(h`<p class="small muted">Running Newman… this can take a while for large suites.</p>`);
        try {
          const r = await C.withProductionSafety((conf) => api.post(`/api/postman/newman?projectId=${p.id}`, { filter: { priority: [...sel.xp], testType: [...sel.xt] }, ...conf }));
